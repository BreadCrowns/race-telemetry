<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pit Wall Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding: 20px; max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    h1 { font-size: 18px; font-weight: 800; color: #f97316; letter-spacing: 1px; text-transform: uppercase; }

    /* Telemetry Watchdog Status Banner */
    .telemetry-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      transition: all 0.3s ease;
    }
    .telemetry-banner.live {
      background: rgba(34, 197, 94, 0.12);
      border-color: #22c55e;
    }
    .telemetry-banner.stale {
      background: rgba(234, 179, 8, 0.12);
      border-color: #eab308;
    }
    .telemetry-banner.offline {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }

    .signal-left { display: flex; align-items: center; gap: 12px; }
    .status-beacon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #64748b;
      position: relative;
    }
    .telemetry-banner.live .status-beacon {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }
    .telemetry-banner.stale .status-beacon {
      background: #eab308;
      box-shadow: 0 0 8px #eab308;
    }
    .telemetry-banner.offline .status-beacon {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .signal-meta { display: flex; flex-direction: column; }
    .signal-title { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
    .telemetry-banner.live .signal-title { color: #4ade80; }
    .telemetry-banner.stale .signal-title { color: #facc15; }
    .telemetry-banner.offline .signal-title { color: #f87171; }
    .signal-detail { font-size: 11px; color: #94a3b8; font-family: ui-monospace, monospace; }

    .ping-display {
      font-size: 11px;
      font-weight: 700;
      font-family: ui-monospace, monospace;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0,0,0,0.3);
      color: #cbd5e1;
    }

    .panel { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #64748b; font-weight: 700; margin-bottom: 12px; }

    /* Live HUD Preview */
    .preview-stage { background: #060913; border: 1px dashed #334155; border-radius: 8px; padding: 24px 16px; display: flex; justify-content: center; align-items: center; }
    .hud-card { display: inline-flex; flex-direction: column; background: rgba(10, 14, 23, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-left: 6px solid #f97316; border-radius: 8px; padding: 10px 18px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.6); gap: 6px; }
    .hud-main-row { display: flex; align-items: center; }
    .driver-col { display: flex; flex-direction: column; margin-right: 20px; padding-right: 18px; border-right: 1px solid rgba(255, 255, 255, 0.15); }
    .driver-tag { font-size: 9px; font-weight: 800; color: #f97316; letter-spacing: 2px; text-transform: uppercase; }
    .driver-val { font-size: 20px; font-weight: 700; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: #334155; color: #cbd5e1; align-self: flex-start; margin-top: 3px; }
    .status-badge.in-pits { background: #b45309; color: #fef3c7; }
    .status-badge.driver-swap { background: #6d28d9; color: #ede9fe; }
    .speed-col { display: flex; align-items: baseline; gap: 5px; }
    .speed-val { font-size: 46px; font-weight: 900; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
    .unit-val { font-size: 13px; font-weight: 700; color: #94a3b8; }

    /* GPS Diagnostic Line */
    .gps-preview-bar { display: flex; align-items: center; gap: 8px; font-family: ui-monospace, monospace; font-size: 10px; color: #94a3b8; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 4px; }
    .gps-coords { color: #cbd5e1; }
    .gps-acc { color: #64748b; margin-left: auto; }

    /* Form Controls */
    .field { margin-bottom: 14px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: 600; }
    input[type="text"] { width: 100%; background: #0a0e1a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    input[type="text"]:focus { border-color: #f97316; }

    .quick-drivers { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .chip { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .chip:active { background: #f97316; color: white; }

    .status-btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 6px; }
    .status-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; text-align: center; }
    .status-btn.active { background: #f97316; color: white; border-color: #f97316; }

    .btn-apply { background: #ea580c; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
    .btn-apply:active { background: #c2410c; }
  </style>
</head>
<body>

  <header>
    <h1>Pit Wall Command</h1>
  </header>

  <!-- Realtime GPS Broadcast Monitor -->
  <div class="telemetry-banner offline" id="watchdog-banner">
    <div class="signal-left">
      <div class="status-beacon"></div>
      <div class="signal-meta">
        <span class="signal-title" id="watchdog-title">GPS OFFLINE</span>
        <span class="signal-detail" id="watchdog-desc">Waiting for cockpit transmitter to start</span>
      </div>
    </div>
    <div class="ping-display" id="watchdog-ping">-- ms</div>
  </div>

  <!-- Live Overlay Preview -->
  <div class="panel">
    <div class="panel-title">PRISM Live Preview</div>
    <div class="preview-stage">
      <div class="hud-card">
        <div class="hud-main-row">
          <div class="driver-col">
            <span class="driver-tag">Driver</span>
            <span class="driver-val" id="prev-driver">Driver 1</span>
            <span class="status-badge" id="prev-status">ON TRACK</span>
          </div>
          <div class="speed-col">
            <span class="speed-val" id="prev-speed">0</span>
            <span class="unit-val">MPH</span>
          </div>
        </div>
        <div class="gps-preview-bar">
          <span class="gps-coords" id="prev-gps-coords">--.----°, --.----°</span>
          <span class="gps-acc" id="prev-gps-acc">OFFLINE</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Driver Controls -->
  <div class="panel">
    <div class="panel-title">Driver Stint Control</div>
    <div class="field">
      <label for="driver-input">Active Driver</label>
      <input type="text" id="driver-input" placeholder="Type driver name..." value="Driver 1" />
      <div class="quick-drivers">
        <button type="button" class="chip" onclick="setDriver('Jeff')">Jeff</button>
        <button type="button" class="chip" onclick="setDriver('Sylvia')">Sylvia</button>
        <button type="button" class="chip" onclick="setDriver('Driver 2')">Driver 2</button>
      </div>
    </div>

    <div class="field">
      <label>Car State Banner</label>
      <div class="status-btn-group">
        <button type="button" class="status-btn active" id="btn-track" onclick="setStatus('ON TRACK')">ON TRACK</button>
        <button type="button" class="status-btn" id="btn-pit" onclick="setStatus('IN PITS')">IN PITS</button>
        <button type="button" class="status-btn" id="btn-change" onclick="setStatus('DRIVER SWAP')">DRIVER SWAP</button>
      </div>
    </div>

    <button class="btn-apply" id="apply-btn" type="button">Push Changes to Stream</button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const driverInput = document.getElementById("driver-input");
    const applyBtn = document.getElementById("apply-btn");

    // Watchdog Elements
    const banner = document.getElementById("watchdog-banner");
    const bannerTitle = document.getElementById("watchdog-title");
    const bannerDesc = document.getElementById("watchdog-desc");
    const bannerPing = document.getElementById("watchdog-ping");

    // Preview Elements
    const prevDriver = document.getElementById("prev-driver");
    const prevStatus = document.getElementById("prev-status");
    const prevSpeed = document.getElementById("prev-speed");
    const prevGpsCoords = document.getElementById("prev-gps-coords");
    const prevGpsAcc = document.getElementById("prev-gps-acc");

    let currentStatus = "ON TRACK";
    let lastKnownTimestamp = 0;
    let latestAccuracy = 0;

    // Database listener with error handler & debug logging
    db.on("value", (snap) => {
      const root = snap.val();
      console.log("Pitwall received packet:", root);
      if (!root) return;

      if (root.driver) {
        prevDriver.textContent = root.driver;
        if (document.activeElement !== driverInput) {
          driverInput.value = root.driver;
        }
      }
      if (root.status) updateStatusUI(root.status);

      // Handle direct properties or nested push objects
      let telem = root;
      if (root.lat === undefined && root.latitude === undefined) {
        const keys = Object.keys(root).filter(k => typeof root[k] === 'object' && root[k] !== null);
        if (keys.length > 0) {
          keys.sort((a, b) => {
            const timeA = Number(root[a].lastGpsTimestamp || (root[a].tst ? root[a].tst * 1000 : 0));
            const timeB = Number(root[b].lastGpsTimestamp || (root[b].tst ? root[b].tst * 1000 : 0));
            return timeA - timeB;
          });
          telem = root[keys[keys.length - 1]];
        }
      }

      // Speed calculation (handles MPH from worker or raw km/h)
      let calcMph = 0;
      if (telem.speed !== undefined && telem.speed !== null) {
        calcMph = Number(telem.speed);
      } else if (telem.vel !== undefined && telem.vel !== null) {
        calcMph = Number(telem.vel) * 0.621371;
      }
      if (calcMph < 2.5 || isNaN(calcMph)) calcMph = 0;
      prevSpeed.textContent = Math.round(calcMph);

      // Coordinate and accuracy handling
      const rawLat = telem.latitude !== undefined ? telem.latitude : telem.lat;
      const rawLon = telem.longitude !== undefined ? telem.longitude : telem.lon;
      const rawAcc = telem.accuracy !== undefined ? telem.accuracy : (telem.acc || 0);
      latestAccuracy = Math.round(Number(rawAcc) || 0);

      // Parse timestamp to number
      let ts = telem.lastGpsTimestamp || (telem.tst ? telem.tst * 1000 : 0);
      if (ts) {
        lastKnownTimestamp = Number(ts);
      }

      if (rawLat !== undefined && rawLon !== undefined && rawLat !== 0 && rawLon !== 0) {
        prevGpsCoords.textContent = `${Number(rawLat).toFixed(4)}°, ${Number(rawLon).toFixed(4)}°`;
      }
    }, (error) => {
      console.error("Firebase connection/read error:", error);
      bannerTitle.textContent = "AUTH PERMISSION ERROR";
      bannerDesc.textContent = "Check Firebase Security Rules (.read must be true)";
      banner.className = "telemetry-banner offline";
    });

    // 1-Second Watchdog Monitor Loop
    setInterval(() => {
      if (!lastKnownTimestamp) {
        setWatchdogState("offline", "GPS OFFLINE", "Waiting for telemetry transmitter", "--");
        return;
      }

      const elapsedMs = Date.now() - lastKnownTimestamp;
      const elapsedSec = (elapsedMs / 1000).toFixed(1);

      if (elapsedMs <= 4000) {
        setWatchdogState(
          "live", 
          "COCKPIT LIVE", 
          `Transmitting | Acc: ±${latestAccuracy}m`, 
          `${elapsedMs} ms ago`
        );
        prevGpsAcc.textContent = `±${latestAccuracy}m`;
      } else if (elapsedMs <= 8000) {
        setWatchdogState(
          "stale", 
          "SIGNAL LAG", 
          `Delayed | Last packet ${elapsedSec}s ago`, 
          `${elapsedSec}s`
        );
      } else {
        setWatchdogState(
          "offline", 
          "SIGNAL LOST", 
          `No packet for ${Math.round(elapsedSec)}s (Check phone/Traccar)`, 
          `${Math.round(elapsedSec)}s`
        );
        prevGpsAcc.textContent = "DROPPED";
      }
    }, 1000);

    function setWatchdogState(stateClass, title, desc, ping) {
      banner.className = `telemetry-banner ${stateClass}`;
      bannerTitle.textContent = title;
      bannerDesc.textContent = desc;
      bannerPing.textContent = ping;
    }

    function setDriver(name) {
      driverInput.value = name;
      pushUpdates();
    }

    function setStatus(status) {
      currentStatus = status;
      updateStatusUI(status);
      pushUpdates();
    }

    function updateStatusUI(status) {
      currentStatus = status;
      prevStatus.textContent = status;
      prevStatus.className = "status-badge";
      if (status === "IN PITS") prevStatus.classList.add("in-pits");
      if (status === "DRIVER SWAP") prevStatus.classList.add("driver-swap");

      document.querySelectorAll(".status-btn").forEach(btn => btn.classList.remove("active"));
      if (status === "ON TRACK") document.getElementById("btn-track").classList.add("active");
      if (status === "IN PITS") document.getElementById("btn-pit").classList.add("active");
      if (status === "DRIVER SWAP") document.getElementById("btn-change").classList.add("active");
    }

    function pushUpdates() {
      db.update({
        driver: driverInput.value.trim() || "Driver",
        status: currentStatus,
        unit: "MPH"
      }).catch(err => {
        console.error("Firebase write error:", err);
      });
    }

    applyBtn.addEventListener("click", pushUpdates);
    driverInput.addEventListener("change", pushUpdates);
  </script>
</body>
</html>
