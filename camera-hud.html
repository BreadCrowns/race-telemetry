<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Cockpit Camera + Telemetry HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      position: fixed;
    }

    /* Native Camera Viewport - Full view, highest aspect match */
    video#camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    /* Mini GPS Diagnostic HUD (Top-Left) */
    .gps-diag {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 15;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      padding: 4px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }
    .gps-diag .live-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .gps-diag .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .gps-diag .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .gps-coords {
      color: #e2e8f0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Primary HUD Overlay Layer */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    /* Interactive Driver HUD Card */
    .hud-card {
      pointer-events: auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 6px solid #f97316;
      border-radius: 8px;
      padding: 8px 18px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .hud-card:active {
      transform: scale(0.97);
    }
    .driver-meta {
      display: flex;
      flex-direction: column;
      margin-right: 18px;
      padding-right: 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    .driver-tag {
      font-size: 9px;
      font-weight: 800;
      color: #f97316;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .driver-tag::after {
      content: '⚙';
      font-size: 9px;
      opacity: 0.6;
    }
    .driver-val {
      font-size: 20px;
      font-weight: 700;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      align-self: flex-start;
      margin-top: 2px;
    }
    .status-badge.in-pits { background: #b45309; color: #fef3c7; }
    .status-badge.driver-swap { background: #6d28d9; color: #ede9fe; }
    .speed-meta {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .speed-val {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      min-width: 65px;
      text-align: right;
    }
    .unit-val {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
    }

    /* G-Force Circle Indicator */
    .g-meter {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .g-meter::before {
      content: '';
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.15);
    }
    .g-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f97316;
      position: absolute;
      transform: translate(0, 0);
      transition: transform 0.08s ease-out;
    }
    .g-label {
      position: absolute;
      bottom: -18px;
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 700;
      text-shadow: 0 1px 3px #000;
    }

    /* Slide-out Settings Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .settings-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 2px solid #f97316;
      border-radius: 16px 16px 0 0;
      padding: 24px;
      z-index: 101;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .settings-drawer.open {
      transform: translateY(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .drawer-title {
      font-size: 14px;
      font-weight: 800;
      color: #f97316;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-close {
      background: #334155;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .menu-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .menu-btn:active {
      background: #334155;
    }
    .menu-btn.active {
      border-color: #f97316;
      color: #f97316;
    }

    /* Initial Fullscreen Gate */
    #start-overlay-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #f97316;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(249, 115, 22, 0.4);
    }
  </style>
</head>
<body>

  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- GPS Diagnostic HUD -->
  <div class="gps-diag" id="gps-diag" style="display: none;">
    <div class="live-row">
      <span class="status-dot" id="gps-dot"></span>
      <span id="gps-status-text">ACQUIRING GPS...</span>
    </div>
    <div class="gps-coords" id="gps-coords">--.----°, --.----°</div>
  </div>

  <button id="start-overlay-btn" type="button">LAUNCH RACE HUD</button>

  <!-- Main HUD Layer -->
  <div class="hud-layer" id="hud-ui" style="display: none;">
    <div class="hud-row">
      <!-- Driver Card (Tap to open Settings Menu) -->
      <div class="hud-card" id="hud-card-btn" title="Tap for Settings">
        <div class="driver-meta">
          <span class="driver-tag">Driver</span>
          <span class="driver-val" id="driver-val">Driver</span>
          <span class="status-badge" id="status-val">ON TRACK</span>
        </div>
        <div class="speed-meta">
          <span class="speed-val" id="speed-val">0</span>
          <span class="unit-val" id="unit-val">MPH</span>
        </div>
      </div>

      <!-- Accelerometer G-Meter -->
      <div class="g-meter">
        <div class="g-dot" id="g-dot"></div>
        <div class="g-label" id="g-text">0.0G</div>
      </div>
    </div>
  </div>

  <!-- Slide-out Settings Menu -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="settings-drawer" id="settings-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Cockpit Controls</span>
      <button class="btn-close" id="btn-close-drawer" type="button">✕</button>
    </div>
    <button class="menu-btn" id="btn-toggle-cam" type="button">
      <span>Switch Camera</span>
      <span id="cam-mode-label" style="color: #94a3b8; font-size: 13px;">Back (Landscape)</span>
    </button>
    <button class="menu-btn" id="btn-zero-g" type="button">
      <span>Zero G-Force / Gyro</span>
      <span style="color: #f97316; font-size: 13px;">🎯 Calibrate</span>
    </button>
    <button class="menu-btn" id="btn-fullscreen" type="button">
      <span>Toggle Fullscreen</span>
      <span style="font-size: 16px;">⛶</span>
    </button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const video = document.getElementById("camera-feed");
    const startBtn = document.getElementById("start-overlay-btn");
    const hudUi = document.getElementById("hud-ui");
    const hudCardBtn = document.getElementById("hud-card-btn");

    const drawerOverlay = document.getElementById("drawer-overlay");
    const settingsDrawer = document.getElementById("settings-drawer");
    const btnCloseDrawer = document.getElementById("btn-close-drawer");

    const btnToggleCam = document.getElementById("btn-toggle-cam");
    const camModeLabel = document.getElementById("cam-mode-label");
    const btnZeroG = document.getElementById("btn-zero-g");
    const btnFullscreen = document.getElementById("btn-fullscreen");

    const gpsDiag = document.getElementById("gps-diag");
    const gpsDot = document.getElementById("gps-dot");
    const gpsStatusText = document.getElementById("gps-status-text");
    const gpsCoords = document.getElementById("gps-coords");

    const driverVal = document.getElementById("driver-val");
    const statusVal = document.getElementById("status-val");
    const speedVal = document.getElementById("speed-val");
    const unitVal = document.getElementById("unit-val");
    const gDot = document.getElementById("g-dot");
    const gText = document.getElementById("g-text");

    let currentUnit = "MPH";
    let targetSpeed = 0;
    let smoothSpeed = 0;
    let currentStream = null;
    let facingMode = "environment"; // default to rear camera

    // Gyro baseline calibration offsets
    let offsetAx = 0;
    let offsetAy = 0;

    // Listen to Firebase for pit wall updates
    db.on("value", (snap) => {
      const val = snap.val();
      if (!val) return;
      driverVal.textContent = val.driver || "Driver";
      unitVal.textContent = val.unit || "MPH";
      currentUnit = val.unit || "MPH";

      const st = val.status || "ON TRACK";
      statusVal.textContent = st;
      statusVal.className = "status-badge";
      if (st === "IN PITS") statusVal.classList.add("in-pits");
      if (st === "DRIVER SWAP") statusVal.classList.add("driver-swap");
    });

    // Speed smoothing
    function animate() {
      smoothSpeed += (targetSpeed - smoothSpeed) * 0.15;
      speedVal.textContent = Math.round(smoothSpeed);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Camera initializer requesting highest resolution without forced digital zoom
    async function initCamera(mode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: mode },
          width: { ideal: 3840, min: 1920 },
          height: { ideal: 2160, min: 1080 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        camModeLabel.textContent = mode === "environment" ? "Back (Landscape)" : "Front (Cockpit)";
      } catch (err) {
        // Fallback to standard HD if 4k/high-bitrate constraints fail on specific browsers
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: { ideal: mode } }
          });
          video.srcObject = currentStream;
          camModeLabel.textContent = mode === "environment" ? "Back (Fallback)" : "Front (Fallback)";
        } catch (e) {
          alert("Camera access error: " + e.message);
        }
      }
    }

    // Toggle Settings Drawer
    function openDrawer() {
      drawerOverlay.classList.add("open");
      settingsDrawer.classList.add("open");
    }
    function closeDrawer() {
      drawerOverlay.classList.remove("open");
      settingsDrawer.classList.remove("open");
    }

    hudCardBtn.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);

    // Camera Switcher
    btnToggleCam.addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      await initCamera(facingMode);
    });

    // Gyro Calibration (Zero out current mount angle)
    btnZeroG.addEventListener("click", () => {
      offsetAx = rawAx;
      offsetAy = rawAy;
      btnZeroG.classList.add("active");
      setTimeout(() => btnZeroG.classList.remove("active"), 400);
    });

    // Fullscreen Toggle
    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    let rawAx = 0;
    let rawAy = 0;

    startBtn.addEventListener("click", async () => {
      startBtn.style.display = "none";
      hudUi.style.display = "flex";
      gpsDiag.style.display = "flex";

      // Enter fullscreen automatically on launch
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // WakeLock
      if ("wakeLock" in navigator) {
        try { await navigator.wakeLock.request("screen"); } catch (e) {}
      }

      // Start initial back camera
      await initCamera(facingMode);

      // GPS Polling
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(4);
            const lon = pos.coords.longitude.toFixed(4);
            const acc = Math.round(pos.coords.accuracy || 0);

            gpsDot.classList.add("active");
            gpsStatusText.textContent = `GPS LOCK (±${acc}m)`;
            gpsCoords.textContent = `${lat}°, ${lon}°`;

            const mps = pos.coords.speed || 0;
            targetSpeed = currentUnit === "MPH" ? (mps * 2.23694) : (mps * 3.6);
          },
          (err) => {
            gpsDot.classList.remove("active");
            gpsStatusText.textContent = `GPS ERR: ${err.message}`;
          },
          { enableHighAccuracy: true, maximumAge: 300, timeout: 5000 }
        );
      }

      // Gyro / Accelerometer
      if (window.DeviceMotionEvent) {
        if (typeof DeviceMotionEvent.requestPermission === "function") {
          try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
        }
        window.addEventListener("devicemotion", (e) => {
          const acc = e.accelerationIncludingGravity;
          if (!acc) return;

          rawAx = acc.x || 0;
          rawAy = acc.y || 0;

          // Compute delta relative to zeroed mount orientation
          const deltaX = rawAx - offsetAx;
          const deltaY = rawAy - offsetAy;

          // In landscape windshield mount:
          // Accel pulls dot DOWN (+Y); Braking pushes dot UP (-Y)
          const invertSign = facingMode === "environment" ? 1 : -1;
          const gX = Math.max(-26, Math.min(26, deltaX * 2.4 * invertSign));
          const gY = Math.max(-26, Math.min(26, deltaY * 2.4));

          gDot.style.transform = `translate(${gX}px, ${gY}px)`;
          const totalG = (Math.sqrt(deltaX**2 + deltaY**2) / 9.8).toFixed(1);
          gText.textContent = `${totalG}G`;
        });
      }
    });
  </script>
</body>
</html>
