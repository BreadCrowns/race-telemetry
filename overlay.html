<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM Stream HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: transparent;
      overflow: hidden;
      padding: 16px;
      display: flex;
      align-items: flex-start;
    }

    .hud-card {
      display: inline-flex;
      flex-direction: column;
      background: rgba(10, 14, 23, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 6px solid #f97316;
      border-radius: 8px;
      padding: 10px 18px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      gap: 6px;
    }

    .hud-main-row {
      display: flex;
      align-items: center;
    }

    .driver-meta {
      display: flex;
      flex-direction: column;
      margin-right: 20px;
      padding-right: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    .driver-tag {
      font-size: 9px;
      font-weight: 800;
      color: #f97316;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .driver-name {
      font-size: 22px;
      font-weight: 700;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      align-self: flex-start;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }
    .status-badge.in-pits { background: #b45309; color: #fef3c7; }
    .status-badge.driver-swap { background: #6d28d9; color: #ede9fe; }
    .status-badge.flag-yellow { background: #ca8a04; color: #fef08a; }
    .status-badge.flag-red { background: #dc2626; color: #fee2e2; }
    .status-badge.flag-cheq { background: #0f172a; color: #f8fafc; border: 1px solid #94a3b8; }

    .speed-container {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .speed-num {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      min-width: 70px;
      text-align: right;
      color: #ffffff;
    }

    .speed-unit {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .gps-sub-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }

    .gps-coords {
      color: #cbd5e1;
      letter-spacing: 0.5px;
    }

    .gps-acc {
      color: #64748b;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="hud-card">
    <div class="hud-main-row">
      <div class="driver-meta">
        <span class="driver-tag">Driver</span>
        <span class="driver-name" id="driver-val">--</span>
        <span class="status-badge" id="status-val">ON TRACK</span>
      </div>
      <div class="speed-container">
        <span class="speed-num" id="speed-val">0</span>
        <span class="speed-unit">MPH</span>
      </div>
    </div>

    <!-- Live GPS Coordinates Bar -->
    <div class="gps-sub-bar">
      <span class="status-dot" id="gps-dot"></span>
      <span class="gps-coords" id="gps-coords">--.----°, --.----°</span>
      <span class="gps-acc" id="gps-acc">STANDBY</span>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const driverEl = document.getElementById("driver-val");
    const statusEl = document.getElementById("status-val");
    const speedEl = document.getElementById("speed-val");
    const gpsDot = document.getElementById("gps-dot");
    const gpsCoords = document.getElementById("gps-coords");
    const gpsAcc = document.getElementById("gps-acc");

    let targetSpeed = 0;
    let smoothSpeed = 0;
    const SPEED_CUTOFF_MPH = 2.5;

    // Linear speed interpolation with instant stop clamp
    function animate() {
      if (targetSpeed === 0) {
        smoothSpeed += (0 - smoothSpeed) * 0.35;
        if (smoothSpeed < 0.4) smoothSpeed = 0;
      } else {
        smoothSpeed += (targetSpeed - smoothSpeed) * 0.18;
      }
      speedEl.textContent = Math.round(smoothSpeed);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Synchronize telemetry from Firebase
    db.on("value", (snap) => {
      const root = snap.val();
      if (!root) return;

      // 1. Driver and Status updates
      if (root.driver) driverEl.textContent = root.driver;
      const st = root.status || "ON TRACK";
      const fl = root.flag || "GREEN";
      statusEl.className = "status-badge";
      if (fl !== "GREEN") {
        statusEl.textContent = `${fl} FLAG`;
        if (fl === "YELLOW") statusEl.classList.add("flag-yellow");
        else if (fl === "RED") statusEl.classList.add("flag-red");
        else if (fl === "CHECKERED") statusEl.classList.add("flag-cheq");
      } else {
        statusEl.textContent = st;
        if (st === "IN PITS") statusEl.classList.add("in-pits");
        if (st === "DRIVER SWAP") statusEl.classList.add("driver-swap");
      }

      // 2. Resolve payload (direct properties vs nested push keys)
      let telem = root;
      if (root.lat === undefined && root.latitude === undefined) {
        const keys = Object.keys(root).filter(k => typeof root[k] === 'object' && root[k] !== null);
        if (keys.length > 0) {
          keys.sort((a, b) => {
            const timeA = Number(root[a].lastGpsTimestamp || (root[a].tst ? root[a].tst * 1000 : 0));
            const timeB = Number(root[b].lastGpsTimestamp || (root[b].tst ? root[b].tst * 1000 : 0));
            return timeA - timeB;
          });
          telem = root[keys[keys.length - 1]];
        }
      }

      // 3. Speed calculation
      let calcMph = 0;
      if (telem.speed !== undefined && telem.speed !== null) {
        calcMph = Number(telem.speed);
      } else if (telem.vel !== undefined && telem.vel !== null) {
        calcMph = Number(telem.vel) * 0.621371;
      }
      if (calcMph < SPEED_CUTOFF_MPH || isNaN(calcMph)) {
        calcMph = 0;
      }
      targetSpeed = calcMph;

      // 4. Coordinates, accuracy, and timestamp resolution
      const rawLat = telem.latitude !== undefined ? telem.latitude : telem.lat;
      const rawLon = telem.longitude !== undefined ? telem.longitude : telem.lon;
      const rawAcc = telem.accuracy !== undefined ? telem.accuracy : (telem.acc || 0);
      const accNum = Math.round(Number(rawAcc) || 0);

      const ts = Number(telem.lastGpsTimestamp || (telem.tst ? telem.tst * 1000 : 0));
      const isLive = ts && (Date.now() - ts < 6000);

      if (isLive && rawLat !== undefined && rawLon !== undefined && rawLat !== 0 && rawLon !== 0) {
        gpsDot.classList.add("active");
        gpsCoords.textContent = `${Number(rawLat).toFixed(4)}°, ${Number(rawLon).toFixed(4)}°`;
        gpsAcc.textContent = `±${accNum}m`;
      } else {
        gpsDot.classList.remove("active");
        gpsAcc.textContent = "SEARCHING";
      }
    }, (error) => {
      console.error("Overlay Firebase read error:", error);
      gpsDot.classList.remove("active");
      gpsAcc.textContent = "AUTH ERR";
    });
  </script>
</body>
</html>
