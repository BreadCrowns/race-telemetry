<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRISM Stream HUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: transparent; overflow: hidden; padding: 14px; }
    .hud-card {
      display: inline-flex;
      align-items: center;
      background: rgba(10, 14, 23, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 6px solid #f97316;
      border-radius: 8px;
      padding: 10px 20px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.65);
    }
    .driver-meta {
      display: flex;
      flex-direction: column;
      margin-right: 20px;
      padding-right: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    .driver-tag { font-size: 9px; font-weight: 800; color: #f97316; letter-spacing: 2px; text-transform: uppercase; }
    .driver-name { font-size: 20px; font-weight: 700; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      align-self: flex-start;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }
    .status-badge.in-pits { background: #b45309; color: #fef3c7; }
    .status-badge.driver-swap { background: #6d28d9; color: #ede9fe; }
    .speed-container { display: flex; align-items: baseline; gap: 6px; }
    .speed-num { font-size: 50px; font-weight: 900; letter-spacing: -2px; font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }
    .speed-unit { font-size: 13px; font-weight: 700; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="hud-card">
    <div class="driver-meta">
      <span class="driver-tag">Driver</span>
      <span class="driver-name" id="driver-val">--</span>
      <span class="status-badge" id="status-val">ON TRACK</span>
    </div>
    <div class="speed-container">
      <span class="speed-num" id="speed-val">0</span>
      <span class="speed-unit" id="unit-val">MPH</span>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
		apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
		authDomain: "fiero-telemetry.firebaseapp.com",
		databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
		projectId: "fiero-telemetry",
		storageBucket: "fiero-telemetry.firebasestorage.app",
		messagingSenderId: "183922450878",
		appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
	};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const driverEl = document.getElementById("driver-val");
    const statusEl = document.getElementById("status-val");
    const speedEl = document.getElementById("speed-val");
    const unitEl = document.getElementById("unit-val");

    let targetSpeed = 0;
    let smoothSpeed = 0;

    // Linear interpolation loop to keep speed changes smooth
    function animate() {
      smoothSpeed += (targetSpeed - smoothSpeed) * 0.15;
      speedEl.textContent = Math.round(smoothSpeed);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    db.on("value", (snap) => {
      const d = snap.val();
      if (!d) return;
      driverEl.textContent = d.driver || "Driver";
      unitEl.textContent = d.unit || "MPH";
      targetSpeed = Math.max(0, d.speed || 0);

      const st = d.status || "ON TRACK";
      statusEl.textContent = st;
      statusEl.className = "status-badge";
      if (st === "IN PITS") statusEl.classList.add("in-pits");
      if (st === "DRIVER SWAP") statusEl.classList.add("driver-swap");
    });
  </script>
</body>
</html>
