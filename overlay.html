<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Race Telemetry Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: transparent;
      overflow: hidden;
      padding: 16px;
    }
    .hud-box {
      display: inline-flex;
      align-items: center;
      background: rgba(10, 14, 23, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 6px solid #f97316; /* Race orange accent */
      border-radius: 8px;
      padding: 10px 20px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    .driver-col {
      display: flex;
      flex-direction: column;
      margin-right: 22px;
      padding-right: 18px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    .driver-label {
      font-size: 10px;
      font-weight: 800;
      color: #f97316;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .driver-val {
      font-size: 20px;
      font-weight: 700;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .speed-col {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .speed-val {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      min-width: 75px;
      text-align: right;
    }
    .unit-val {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="hud-box">
    <div class="driver-col">
      <span class="driver-label">Driver</span>
      <span class="driver-val" id="driver-name">--</span>
    </div>
    <div class="speed-col">
      <span class="speed-val" id="speed-display">0</span>
      <span class="unit-val" id="unit-display">MPH</span>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
		apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
		authDomain: "fiero-telemetry.firebaseapp.com",
		databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
		projectId: "fiero-telemetry",
		storageBucket: "fiero-telemetry.firebasestorage.app",
		messagingSenderId: "183922450878",
		appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
	};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const driverEl = document.getElementById("driver-name");
    const speedEl = document.getElementById("speed-display");
    const unitEl = document.getElementById("unit-display");

    let targetSpeed = 0;
    let renderedSpeed = 0;

    // Smooth speed transitions between 1 Hz GPS hits
    function smoothSpeed() {
      renderedSpeed += (targetSpeed - renderedSpeed) * 0.15;
      speedEl.textContent = Math.round(renderedSpeed);
      requestAnimationFrame(smoothSpeed);
    }
    requestAnimationFrame(smoothSpeed);

    db.on("value", (snap) => {
      const val = snap.val();
      if (!val) return;
      driverEl.textContent = val.driver || "Driver";
      unitEl.textContent = val.unit || "MPH";
      targetSpeed = Math.max(0, val.speed || 0);
    });
  </script>
</body>
</html>
