<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Race Telemetry - Command Bar Widget</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.45);
      --glass-bg: rgba(10, 15, 29, 0.90);
      --glass-border: rgba(255, 255, 255, 0.16);
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #38bdf8;
      --purple: #a855f7;
    }

    /* Streamlabs Transparent Background */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      position: fixed;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: max(4px, env(safe-area-inset-top, 4px))
               max(8px, env(safe-area-inset-right, 8px))
               max(4px, env(safe-area-inset-bottom, 4px))
               max(8px, env(safe-area-inset-left, 8px));
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Common Glass Card Styling */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    /* Consolidated Telemetry Command Bar */
    .combined-pill {
      display: inline-flex;
      flex-direction: column;
      border-left: 5px solid var(--accent);
      padding: 6px 12px 5px 12px;
      gap: 0;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-width: 460px;
    }
    .combined-pill:active {
      transform: scale(0.985);
    }
    .cp-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .cp-status-line {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      margin-top: 5px;
      padding-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      height: 18px;
    }
    .cp-status-tag {
      font-size: 7.5px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(249, 115, 22, 0.18);
      border: 1px solid rgba(249, 115, 22, 0.4);
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
      line-height: 1.1;
    }
    .ticker-wrap {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .ticker-content {
      display: inline-block;
      white-space: nowrap;
    }
    .ticker-text {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .ticker-clone {
      margin-left: 24px;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: inline-flex !important;
      animation: marquee 14s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
    .cp-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .car-badge {
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: -0.5px;
      padding: 5px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      box-shadow: 0 0 10px var(--accent-glow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
      height: 32px;
      box-sizing: border-box;
    }
    .dp-driver-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cp-laps-pair {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cp-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 110px;
    }
    .watermark-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .watermark-title {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
    }
    .watermark-sub {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 8px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #ef4444;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .rec-dot {
      width: 5px;
      height: 5px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .gps-lock-badge {
      font-size: 7.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      letter-spacing: 0.5px;
      width: fit-content;
      text-transform: uppercase;
      font-family: ui-monospace, monospace;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .dp-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
    }
    .dp-tag {
      font-size: 8px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    /* 1. Driver Name */
    .dp-driver-val {
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* 2. Lap Timer Sub-Section in Combined Pill */
    .cp-lap-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 115px;
    }
    .running-lap-clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 20px;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .lap-comparison-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 8.5px;
      color: #94a3b8;
      white-space: nowrap;
    }

    /* 3. Current Speed */
    .dp-speed-wrap {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .dp-speed-digits {
      font-size: 32px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #ffffff;
      min-width: 42px;
      text-align: right;
    }
    .dp-speed-unit {
      font-size: 10px;
      font-weight: 900;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* 4. Stint Time & 2-Hour Limit Countdown */
    .dp-stint-wrap {
      min-width: 130px;
    }
    .dp-stint-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }
    .dp-stint-clock {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 800;
      color: #f8fafc;
    }
    .stint-bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }
    .stint-bar-fill {
      height: 100%;
      width: 15%;
      background: var(--green);
      transition: width 0.5s ease, background 0.3s ease;
      border-radius: 3px;
    }
    .stint-bar-fill.warn-amber { background: var(--yellow); }
    .stint-bar-fill.alert-red { background: var(--red); }
    .dp-stint-remain {
      font-size: 8px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }

    /* 5. Driver Laps & Total Team Laps */
    .dp-laps-wrap {
      text-align: center;
      min-width: 55px;
    }
    .dp-lap-num {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
    }
    .dp-lap-num.team {
      color: var(--blue);
    }
    .dp-lap-sub {
      font-size: 7px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Settings Flyout Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .settings-drawer {
      position: fixed;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100vh;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 101;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }
    .settings-drawer.open {
      right: 0;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }
    .drawer-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .form-input, .form-select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .drawer-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .drawer-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .drawer-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row .drawer-btn {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Consolidated Telemetry Command Bar -->
  <div class="glass-panel combined-pill interactive" id="btn-open-settings" title="Tap to customize settings">
    
    <!-- Top Metrics Row -->
    <div class="cp-top-row">
      <!-- Car Number Badge -->
      <span class="car-badge" id="car-number-badge">#901</span>

      <div class="dp-divider"></div>

      <!-- Driver Name -->
      <div class="cp-section cp-driver">
        <span class="dp-tag">DRIVER</span>
        <div class="dp-driver-row">
          <span class="dp-driver-val" id="dp-driver-name">MATT</span>
        </div>
      </div>

      <div class="dp-divider"></div>

      <!-- Integrated Lap Times & Running Lap Clock -->
      <div class="cp-section cp-lap-wrap">
        <span class="dp-tag">LAP TIME</span>
        <div class="running-lap-clock" id="running-lap-clock">00:00.00</div>
        <div class="lap-comparison-row">
          <span>LAST: <strong id="last-lap-val" style="color:#f8fafc;">01:53.40</strong></span>
          <span style="opacity: 0.35;">•</span>
          <span>BEST: <strong id="best-lap-val" style="color:#a855f7;">01:51.15</strong></span>
        </div>
      </div>

      <div class="dp-divider"></div>

      <!-- Current Speed (MPH Only) -->
      <div class="cp-section">
        <span class="dp-tag">SPEED</span>
        <div class="dp-speed-wrap">
          <span class="dp-speed-digits" id="speed-digits">0</span>
          <span class="dp-speed-unit">MPH</span>
        </div>
      </div>

      <div class="dp-divider"></div>

      <!-- Stint Time & 2-Hour Limit Countdown -->
      <div class="cp-section dp-stint-wrap" id="stint-box">
        <div class="dp-stint-header">
          <span class="dp-tag">STINT TIME</span>
          <span class="dp-stint-clock" id="stint-clock-val">00:00:00</span>
        </div>
        <div class="stint-bar-wrap">
          <div class="stint-bar-fill" id="stint-bar-fill" style="width: 15%;"></div>
        </div>
        <div class="dp-stint-remain">
          <span id="stint-alert-text">NORMAL STINT</span>
          <span id="stint-remain-text">1h 48m REM</span>
        </div>
      </div>

      <div class="dp-divider"></div>

      <!-- Driver Laps & Total Team Laps -->
      <div class="cp-section cp-laps-pair">
        <div class="dp-laps-wrap">
          <span class="dp-tag">DRIVER</span>
          <span class="dp-lap-num" id="driver-laps-val">15</span>
          <span class="dp-lap-sub">LAPS</span>
        </div>
        <div class="dp-laps-wrap">
          <span class="dp-tag">TEAM</span>
          <span class="dp-lap-num team" id="team-laps-val">87</span>
          <span class="dp-lap-sub">TOTAL</span>
        </div>
      </div>

      <div class="dp-divider"></div>

      <!-- Event Watermark, REC Timecode & GPS Status Lock -->
      <div class="cp-section cp-meta">
        <div class="watermark-title" id="watermark-event-title">24H LEMONS • SONOMA</div>
        <div class="watermark-sub">
          <span class="rec-indicator"><span class="rec-dot"></span>REC</span>
          <span>&bull;</span>
          <span id="live-timecode-val">00:00:00 UTC</span>
        </div>
        <span class="gps-lock-badge" id="gps-status-pill">DB GPS LOCK</span>
      </div>
    </div>

    <!-- Custom Text Status Line Under Entire Widget -->
    <div class="cp-status-line" id="cp-status-line">
      <span class="cp-status-tag">STATUS</span>
      <div class="ticker-wrap" id="ticker-wrap">
        <div class="ticker-content" id="ticker-content">
          <span class="ticker-text" id="custom-status-text">ON TRACK</span>
          <span class="ticker-text ticker-clone" id="custom-status-clone"></span>
        </div>
      </div>
    </div>

  </div>

  <!-- Settings Flyout Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="settings-drawer" id="settings-drawer">
    <div class="drawer-header">
      <span class="drawer-title">⚙️ Telemetry Settings</span>
      <button class="btn-close" id="btn-close-drawer" type="button">✕</button>
    </div>

    <!-- Active Driver Control -->
    <div class="form-group">
      <label class="form-label">Active Driver</label>
      <select class="form-select" id="cfg-driver">
        <option value="MATT">Matt</option>
        <option value="DAVE">Dave</option>
        <option value="CHRIS">Chris</option>
        <option value="IN PITS">In Pits / Standby</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Car Number & Event Title</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" class="form-input" id="cfg-car-number" value="#901" style="width: 70px; text-align: center;" />
        <input type="text" class="form-input" id="cfg-event-title" value="24 HOURS OF LEMONS • SONOMA RACEWAY" style="flex: 1;" />
      </div>
    </div>

    <!-- Custom Status Text / Pit Wall Broadcast -->
    <div class="form-group">
      <label class="form-label">Pit Wall Status / Broadcast Message</label>
      <input type="text" class="form-input" id="cfg-custom-status" placeholder="e.g. BOX THIS LAP" value="ON TRACK" />
    </div>

    <!-- Driver Laps & Team Laps Manual Adjust -->
    <div class="form-group">
      <label class="form-label">Lap Counts (Driver Stint / Team Total)</label>
      <div style="display: flex; gap: 8px;">
        <input type="number" class="form-input" id="cfg-driver-laps" value="15" style="flex: 1;" placeholder="Driver Laps" />
        <input type="number" class="form-input" id="cfg-team-laps" value="87" style="flex: 1;" placeholder="Team Total" />
      </div>
    </div>

    <!-- Stint Reset -->
    <button class="drawer-btn" id="btn-reset-stint" type="button">
      <span>⏱️ Restart Driver Stint Clock</span>
    </button>

    <button class="drawer-btn" id="btn-toggle-demo" type="button">
      <span>🏎️ Demo Simulation</span>
    </button>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    // --- DOM REFERENCES ---
    const btnOpenSettings = document.getElementById("btn-open-settings");
    const drawerOverlay = document.getElementById("drawer-overlay");
    const settingsDrawer = document.getElementById("settings-drawer");
    const btnCloseDrawer = document.getElementById("btn-close-drawer");

    const carNumberBadge = document.getElementById("car-number-badge");
    const watermarkEventTitle = document.getElementById("watermark-event-title");
    const liveTimecodeVal = document.getElementById("live-timecode-val");
    const gpsStatusPill = document.getElementById("gps-status-pill");

    // Driver & Custom Status Elements
    const dpDriverName = document.getElementById("dp-driver-name");
    const cpStatusLine = document.getElementById("cp-status-line");
    const tickerWrap = document.getElementById("ticker-wrap");
    const tickerContent = document.getElementById("ticker-content");
    const customStatusText = document.getElementById("custom-status-text");
    const customStatusClone = document.getElementById("custom-status-clone");
    const speedDigits = document.getElementById("speed-digits");
    const stintClockVal = document.getElementById("stint-clock-val");
    const stintBarFill = document.getElementById("stint-bar-fill");
    const stintAlertText = document.getElementById("stint-alert-text");
    const stintRemainText = document.getElementById("stint-remain-text");
    const driverLapsVal = document.getElementById("driver-laps-val");
    const teamLapsVal = document.getElementById("team-laps-val");

    // Lap Timer Elements
    const runningLapClock = document.getElementById("running-lap-clock");
    const lastLapVal = document.getElementById("last-lap-val");
    const bestLapVal = document.getElementById("best-lap-val");

    // Settings Drawer Elements
    const cfgDriver = document.getElementById("cfg-driver");
    const cfgCarNumber = document.getElementById("cfg-car-number");
    const cfgEventTitle = document.getElementById("cfg-event-title");
    const cfgCustomStatus = document.getElementById("cfg-custom-status");
    const cfgDriverLaps = document.getElementById("cfg-driver-laps");
    const cfgTeamLaps = document.getElementById("cfg-team-laps");
    const btnResetStint = document.getElementById("btn-reset-stint");
    const btnToggleDemo = document.getElementById("btn-toggle-demo");

    // --- STATE & TELEMETRY VARIABLES ---
    let activeDriver = "MATT";
    let carNumber = "#901";
    let eventTitle = "24 HOURS OF LEMONS • SONOMA RACEWAY";

    let stintStartTime = Date.now() - (62 * 60 * 1000); // 62 mins into stint
    const MAX_STINT_MS = 2 * 60 * 60 * 1000; // 2 hours max stint

    let driverLaps = 15;
    let teamLaps = 87;

    let currentLap = 14;
    let lapStartTime = Date.now() - 48000;
    let lastLapMs = 113400; // 1:53.40
    let bestLapMs = 111150; // 1:51.15

    let targetSpeedMph = 0;
    let smoothSpeedMph = 0;
    const SPEED_CUTOFF_MPH = 2.5;

    let isDemoMode = false;

    // Time Formatters
    function pad(n, z = 2) { return String(Math.floor(n)).padStart(z, "0"); }
    function formatTimeMs(ms) {
      if (!ms || ms <= 0) return "00:00.00";
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      const c = Math.floor((ms % 1000) / 10);
      return `${pad(m)}:${pad(s)}.${pad(c)}`;
    }
    function formatClock(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    // --- 60 FPS ANIMATION LOOP ---
    function render() {
      const now = Date.now();

      // 1. Smooth Speed Lerp (60 FPS fluid momentum)
      smoothSpeedMph += (targetSpeedMph - smoothSpeedMph) * 0.08;
      if (Math.abs(smoothSpeedMph - targetSpeedMph) < 0.2) smoothSpeedMph = targetSpeedMph;
      speedDigits.textContent = Math.round(smoothSpeedMph);

      // 2. UTC Master Clock Timecode
      const d = new Date(now);
      liveTimecodeVal.textContent = `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;

      // 3. Stint Clock & Visual Bar
      const stintElapsed = now - stintStartTime;
      stintClockVal.textContent = formatClock(stintElapsed);

      const remainMs = Math.max(0, MAX_STINT_MS - stintElapsed);
      const remainMinutes = Math.floor(remainMs / 60000);
      const stintFraction = Math.min(1.0, stintElapsed / MAX_STINT_MS);
      stintBarFill.style.width = `${(stintFraction * 100).toFixed(1)}%`;

      if (remainMinutes <= 5) {
        stintBarFill.className = "stint-bar-fill alert-red";
        stintAlertText.textContent = "🚨 BOX THIS LAP (MAX STINT)";
        stintAlertText.style.color = "#ef4444";
        stintRemainText.textContent = `${remainMinutes}m REM`;
      } else if (remainMinutes <= 20) {
        stintBarFill.className = "stint-bar-fill warn-amber";
        stintAlertText.textContent = "⚠️ PIT WINDOW OPEN";
        stintAlertText.style.color = "#facc15";
        stintRemainText.textContent = `${remainMinutes}m REM`;
      } else {
        stintBarFill.className = "stint-bar-fill";
        stintAlertText.textContent = "NORMAL STINT";
        stintAlertText.style.color = "#cbd5e1";
        const hRem = Math.floor(remainMinutes / 60);
        const mRem = remainMinutes % 60;
        stintRemainText.textContent = `${hRem}h ${mRem}m REM`;
      }

      // 4. Lap Counts
      driverLapsVal.textContent = driverLaps;
      teamLapsVal.textContent = teamLaps;

      // 5. Running Lap Timer
      const lapElapsed = Math.max(0, now - lapStartTime);
      runningLapClock.textContent = formatTimeMs(lapElapsed);

      if (isDemoMode) {
        const loopT = (now % 112000) / 112000;
        targetSpeedMph = 45 + Math.sin(loopT * Math.PI * 4) * 35;
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // --- FIREBASE RTDB INGESTION ---
    let prevServerGpsTime = 0;
    let lastFreshDataWallTime = 0;
    const FIREBASE_REST_URL = "https://fiero-telemetry-default-rtdb.firebaseio.com/raceTelemetry.json";

    // Custom Text Status Ticker (Auto-scrolls when text exceeds width)
    let currentCustomStatus = "ON TRACK";
    function updateCustomStatus(text) {
      const clean = (text || "ON TRACK").trim();
      currentCustomStatus = clean;
      customStatusText.textContent = clean.toUpperCase();

      requestAnimationFrame(() => {
        const textWidth = customStatusText.scrollWidth;
        const containerWidth = tickerWrap ? tickerWrap.clientWidth : 0;

        if (containerWidth > 0 && textWidth > containerWidth) {
          customStatusClone.textContent = `• • • ${clean.toUpperCase()}`;
          customStatusClone.style.display = "inline";
          tickerContent.classList.add("animate-marquee");
          const duration = Math.max(10, Math.round(clean.length * 0.25));
          tickerContent.style.animationDuration = `${duration}s`;
        } else {
          customStatusClone.textContent = "";
          customStatusClone.style.display = "none";
          tickerContent.classList.remove("animate-marquee");
        }
      });
    }

    window.addEventListener("resize", () => {
      updateCustomStatus(currentCustomStatus);
    });

    function ingestTelemetryRoot(root) {
      if (!root || typeof root !== 'object') return;
      const now = Date.now();

      // 1. Driver Name & Custom Status from Firebase
      const driver = root.driver || (root.autox && root.autox.driver) || activeDriver;
      if (driver && driver.toUpperCase() !== activeDriver) {
        activeDriver = driver.toUpperCase();
        dpDriverName.textContent = activeDriver;
        cfgDriver.value = activeDriver;
      }

      // Live Custom Status update from Pit Wall text box / Firebase
      const statusText = (root.statusText || root.status || root.notes || root.customStatus || root.customText || root.message || (root.autox && (root.autox.statusText || root.autox.status || root.autox.notes)) || "").trim();
      if (statusText) {
        updateCustomStatus(statusText);
      } else {
        updateCustomStatus("ON TRACK");
      }

      let telem = root;
      if (root.lat === undefined && root.latitude === undefined && root.speed === undefined) {
        const keys = Object.keys(root).filter(k => typeof root[k] === 'object' && root[k] !== null && k !== 'autox');
        if (keys.length > 0) telem = root[keys[keys.length - 1]];
      }

      const ts = Number(telem.lastGpsTimestamp || telem.deviceTimestamp || (telem.tst ? telem.tst * 1000 : 0));
      if (ts && ts > 0) {
        if (prevServerGpsTime === 0) {
          if (Math.abs(now - ts) < 5000) lastFreshDataWallTime = now;
          prevServerGpsTime = ts;
        } else if (ts !== prevServerGpsTime) {
          prevServerGpsTime = ts;
          lastFreshDataWallTime = now;
        } else if (Math.abs(now - ts) < 4000) {
          lastFreshDataWallTime = now;
        }
      } else {
        lastFreshDataWallTime = now;
      }

      let calcMph = 0;
      if (telem.speed !== undefined && telem.speed !== null) {
        calcMph = Number(telem.speed);
      } else if (telem.vel !== undefined && telem.vel !== null) {
        calcMph = Number(telem.vel) * 0.621371;
      }
      if (calcMph < SPEED_CUTOFF_MPH || isNaN(calcMph)) calcMph = 0;
      targetSpeedMph = calcMph;

      checkGpsStatusFreshness();
    }

    db.on("value", (snap) => ingestTelemetryRoot(snap.val()));

    let isFetchingFallback = false;
    async function fetchTelemetryFallback() {
      if (isFetchingFallback || isDemoMode) return;
      isFetchingFallback = true;
      try {
        const res = await fetch(FIREBASE_REST_URL, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          ingestTelemetryRoot(data);
        }
      } catch (e) {
      } finally {
        isFetchingFallback = false;
      }
    }

    function checkGpsStatusFreshness() {
      if (isDemoMode) return;
      const now = Date.now();
      const age = lastFreshDataWallTime ? (now - lastFreshDataWallTime) : Infinity;

      if (age < 4000) {
        gpsStatusPill.textContent = "DB GPS LOCK";
        gpsStatusPill.style.color = "#4ade80";
      } else if (age < 8000) {
        gpsStatusPill.textContent = "DB DELAY";
        gpsStatusPill.style.color = "#facc15";
      } else {
        gpsStatusPill.textContent = "WAITING FOR DB";
        gpsStatusPill.style.color = "#f87171";
      }
    }

    setInterval(() => {
      checkGpsStatusFreshness();
      const now = Date.now();
      if (!isDemoMode && (!lastFreshDataWallTime || (now - lastFreshDataWallTime) > 2000)) {
        fetchTelemetryFallback();
      }
    }, 1000);

    function handleAppWakeup() {
      if (typeof firebase !== "undefined" && firebase.database) {
        try { firebase.database().goOnline(); } catch (e) {}
      }
      fetchTelemetryFallback();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") handleAppWakeup();
    });
    window.addEventListener("focus", handleAppWakeup);
    window.addEventListener("pageshow", handleAppWakeup);

    firebase.database().ref(".info/connected").on("value", (snap) => {
      if (!snap.val() && !isDemoMode) {
        try { firebase.database().goOnline(); } catch (e) {}
        fetchTelemetryFallback();
      }
    });

    // Settings Drawer Controls
    function openDrawer() {
      drawerOverlay.classList.add("open");
      settingsDrawer.classList.add("open");
    }
    function closeDrawer() {
      drawerOverlay.classList.remove("open");
      settingsDrawer.classList.remove("open");
    }

    btnOpenSettings.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);

    cfgDriver.addEventListener("change", (e) => {
      activeDriver = e.target.value;
      dpDriverName.textContent = activeDriver;
      stintStartTime = Date.now();
      driverLaps = 0;
    });

    cfgCarNumber.addEventListener("input", (e) => {
      carNumberBadge.textContent = e.target.value;
    });

    cfgEventTitle.addEventListener("input", (e) => {
      watermarkEventTitle.textContent = e.target.value.toUpperCase();
    });

    cfgDriverLaps.addEventListener("input", (e) => {
      driverLaps = parseInt(e.target.value) || 0;
    });

    cfgTeamLaps.addEventListener("input", (e) => {
      teamLaps = parseInt(e.target.value) || 0;
    });

    if (cfgCustomStatus) {
      cfgCustomStatus.addEventListener("input", (e) => {
        updateCustomStatus(e.target.value);
      });
    }

    btnResetStint.addEventListener("click", () => {
      stintStartTime = Date.now();
      driverLaps = 0;
      closeDrawer();
    });

    btnToggleDemo.addEventListener("click", () => {
      isDemoMode = !isDemoMode;
      btnToggleDemo.classList.toggle("active", isDemoMode);
      if (isDemoMode) {
        lapStartTime = Date.now();
        stintStartTime = Date.now() - (75 * 60 * 1000);
      }
      closeDrawer();
    });

    // URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("demo") === "1" || urlParams.get("demo") === "true") {
      isDemoMode = true;
      btnToggleDemo.classList.add("active");
      lapStartTime = Date.now();
      stintStartTime = Date.now() - (75 * 60 * 1000);
    }
    if (urlParams.get("driver")) {
      activeDriver = urlParams.get("driver").toUpperCase();
      dpDriverName.textContent = activeDriver;
      cfgDriver.value = activeDriver;
    }
    if (urlParams.get("car")) {
      const c = urlParams.get("car");
      carNumberBadge.textContent = c.startsWith("#") ? c : `#${c}`;
      cfgCarNumber.value = carNumberBadge.textContent;
    }
    if (urlParams.get("event")) {
      watermarkEventTitle.textContent = urlParams.get("event").toUpperCase();
      cfgEventTitle.value = watermarkEventTitle.textContent;
    }
    if (urlParams.get("driverLaps")) {
      driverLaps = parseInt(urlParams.get("driverLaps")) || driverLaps;
      cfgDriverLaps.value = driverLaps;
    }
    if (urlParams.get("teamLaps")) {
      teamLaps = parseInt(urlParams.get("teamLaps")) || teamLaps;
      cfgTeamLaps.value = teamLaps;
    }
    if (urlParams.get("status")) {
      const s = urlParams.get("status");
      updateCustomStatus(s);
      if (cfgCustomStatus) cfgCustomStatus.value = s;
    }
  </script>
</body>
</html>
