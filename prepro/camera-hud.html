<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Streamlabs Cockpit Telemetry HUD [PREPRO]</title>
  
  <!-- Leaflet CSS & JS for Live Dark Mode GPS Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.45);
      --glass-bg: rgba(10, 15, 29, 0.90);
      --glass-border: rgba(255, 255, 255, 0.16);
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #38bdf8;
      --purple: #a855f7;
    }

    /* Streamlabs Transparent Background */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      position: fixed;
      color: #f8fafc;
    }

    /* Primary HUD Overlay Container with Mobile Safe Area Insets */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: max(8px, env(safe-area-inset-top, 8px)) 
               max(12px, env(safe-area-inset-right, 12px)) 
               max(10px, env(safe-area-inset-bottom, 10px)) 
               max(12px, env(safe-area-inset-left, 12px));
      gap: 10px;
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Common Glass Card Styling */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    /* ========================================================
       CONSOLIDATED COMMAND PILL (CENTERED ON BOTTOM OF SCREEN)
       Unifies Top Watermark + Driver Telemetry into 1 Widget
       ======================================================== */
    .combined-pill {
      display: inline-flex;
      align-items: center;
      border-left: 5px solid var(--accent);
      padding: 6px 12px;
      gap: 10px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .combined-pill:active {
      transform: scale(0.985);
    }
    .cp-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cp-car-driver {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cp-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cp-laps-pair {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cp-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 110px;
    }
    .car-badge {
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: -0.5px;
      padding: 4px 7px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .watermark-meta {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .watermark-title {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
    }
    .watermark-sub {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 8px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .rec-indicator {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #ef4444;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .rec-dot {
      width: 5px;
      height: 5px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .gps-lock-badge {
      font-size: 7.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      letter-spacing: 0.5px;
      width: fit-content;
      text-transform: uppercase;
      font-family: ui-monospace, monospace;
      transition: color 0.3s ease, border-color 0.3s ease;
    }
    .dp-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.14);
    }
    .dp-tag {
      font-size: 8px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    /* 1. Driver Name */
    .dp-driver-val {
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .dp-status-badge {
      font-size: 8px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid var(--green);
      letter-spacing: 0.5px;
      width: fit-content;
      text-transform: uppercase;
    }

    /* 2. Current Speed */
    .dp-speed-wrap {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .dp-speed-digits {
      font-size: 32px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
      line-height: 1;
      color: #ffffff;
      min-width: 42px;
      text-align: right;
    }
    .dp-speed-unit {
      font-size: 10px;
      font-weight: 900;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* 3. Stint Time & 2-Hour Limit Countdown */
    .dp-stint-wrap {
      min-width: 130px;
    }
    .dp-stint-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }
    .dp-stint-clock {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 800;
      color: #f8fafc;
    }
    .stint-bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 3px;
    }
    .stint-bar-fill {
      height: 100%;
      width: 15%;
      background: var(--green);
      transition: width 0.5s ease, background 0.3s ease;
      border-radius: 3px;
    }
    .stint-bar-fill.warn-amber { background: var(--yellow); }
    .stint-bar-fill.alert-red { background: var(--red); }
    .dp-stint-remain {
      font-size: 8px;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-top: 2px;
      display: flex;
      justify-content: space-between;
    }

    /* 4 & 5. Driver Laps & Total Team Laps */
    .dp-laps-wrap {
      text-align: center;
      min-width: 55px;
    }
    .dp-lap-num {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
    }
    .dp-lap-num.team {
      color: var(--blue);
    }
    .dp-lap-sub {
      font-size: 7px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ========================================================
       BOTTOM ROW: LAP TIMER | FRICTION CIRCLE | LIVE GPS MAP
       ======================================================== */
    .hud-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      gap: 12px;
      flex-wrap: nowrap;
    }

    /* Lap Timer Sub-Block (Bottom-Left) */
    .timer-panel {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 14px;
      border-left: 5px solid var(--accent);
      min-width: 170px;
      flex-shrink: 0;
    }
    .running-lap-clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 32px;
      line-height: 1.05;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .lap-comparison-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      color: #94a3b8;
    }

    /* Bottom-Right Cluster */
    .bottom-right-cluster {
      display: inline-flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Minimalist Friction Circle (Floating target, no square background) */
    .g-meter-minimal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      position: relative;
      flex-shrink: 0;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0;
    }
    canvas#g-canvas {
      width: 104px;
      height: 104px;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
    }
    .g-minimal-readout {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      padding: 1px 7px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 9px;
      font-weight: 800;
      color: #f8fafc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .g-minimal-peak {
      color: var(--accent);
      font-size: 8px;
      font-weight: 700;
    }

    /* ========================================================
       LIVE SATELLITE IMAGERY GPS MAP WINDOW
       ======================================================== */
    .live-map-panel {
      width: 195px;
      height: 140px;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      padding: 0 !important;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      background: #0f172a;
    }
    .live-map-header {
      position: absolute;
      top: 5px;
      left: 6px;
      right: 6px;
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 29, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 5px;
      padding: 2px 6px;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .live-map-title {
      font-size: 8px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .live-map-coords {
      font-size: 8px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    #live-gps-map {
      width: 100%;
      height: 100%;
      background: #0b0f19;
    }

    /* Google Maps Style Pulsing GPS Puck (High Contrast Satellite) */
    .gps-puck-container {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gps-puck-radar {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(14, 165, 233, 0.4);
      border: 1.5px solid #38bdf8;
      animation: radar-pulse 1.8s infinite ease-out;
    }
    @keyframes radar-pulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .gps-puck-core {
      position: relative;
      width: 11px;
      height: 11px;
      background: #0284c7;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8, 0 1px 4px rgba(0, 0, 0, 0.8);
    }
      width: 10px;
      height: 10px;
      background: #2563eb;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* ========================================================
       SETTINGS FLYOUT DRAWER (TOUCH-TESTING)
       ======================================================== */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .settings-drawer {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translate(-50%, 100%);
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 2px solid var(--accent);
      border-radius: 16px 16px 0 0;
      padding: 18px 20px;
      z-index: 101;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 85vh;
      overflow-y: auto;
      pointer-events: auto;
    }
    .settings-drawer.open {
      transform: translate(-50%, 0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .drawer-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-close {
      background: #334155;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-select, .form-input {
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }
    .form-select:focus, .form-input:focus { border-color: var(--accent); }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .drawer-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .drawer-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #020617;
    }
  </style>
</head>
<body>

  <!-- Main Streamlabs HUD Layer -->
  <div class="hud-layer" id="hud-ui">
    
    <!-- ==================== HUD BOTTOM ROW (ALL METRICS CONSOLIDATED ALONG BOTTOM) ==================== -->
    <div class="hud-bottom-row">
      
      <!-- 1. Lap Timing (Bottom-Left) -->
      <div class="glass-panel timer-panel">
        <span class="dp-tag" style="letter-spacing: 1.5px;">LAP TIME</span>
        <div class="running-lap-clock" id="running-lap-clock">00:00.00</div>
        <div class="lap-comparison-row">
          <span>LAST: <strong id="last-lap-val" style="color:#f8fafc;">01:53.40</strong></span>
          <span style="opacity: 0.35;">•</span>
          <span>BEST: <strong id="best-lap-val" style="color:#a855f7;">01:51.15</strong></span>
        </div>
      </div>

      <!-- 2. Consolidated Telemetry Command Bar (Combined Top Widgets, Centered Bottom) -->
      <div class="glass-panel combined-pill interactive" id="btn-open-settings" title="Tap to customize settings">
        
        <!-- Car Badge & Driver Name/Status -->
        <div class="cp-section cp-car-driver">
          <span class="car-badge" id="car-number-badge">#42</span>
          <div class="cp-col">
            <span class="dp-tag">DRIVER</span>
            <span class="dp-driver-val" id="dp-driver-name">MATT</span>
            <span class="dp-status-badge" id="dp-status">ON TRACK</span>
          </div>
        </div>

        <div class="dp-divider"></div>

        <!-- Current Speed (MPH Only) -->
        <div class="cp-section">
          <span class="dp-tag">SPEED</span>
          <div class="dp-speed-wrap">
            <span class="dp-speed-digits" id="speed-digits">0</span>
            <span class="dp-speed-unit">MPH</span>
          </div>
        </div>

        <div class="dp-divider"></div>

        <!-- Stint Time & 2-Hour Limit Countdown -->
        <div class="cp-section dp-stint-wrap" id="stint-box">
          <div class="dp-stint-header">
            <span class="dp-tag">STINT TIME</span>
            <span class="dp-stint-clock" id="stint-clock-val">00:00:00</span>
          </div>
          <div class="stint-bar-wrap">
            <div class="stint-bar-fill" id="stint-bar-fill" style="width: 15%;"></div>
          </div>
          <div class="dp-stint-remain">
            <span id="stint-alert-text">NORMAL STINT</span>
            <span id="stint-remain-text">1h 48m REM</span>
          </div>
        </div>

        <div class="dp-divider"></div>

        <!-- Driver Laps & Total Team Laps -->
        <div class="cp-section cp-laps-pair">
          <div class="dp-laps-wrap">
            <span class="dp-tag">DRIVER</span>
            <span class="dp-lap-num" id="driver-laps-val">15</span>
            <span class="dp-lap-sub">LAPS</span>
          </div>
          <div class="dp-laps-wrap">
            <span class="dp-tag">TEAM</span>
            <span class="dp-lap-num team" id="team-laps-val">87</span>
            <span class="dp-lap-sub">TOTAL</span>
          </div>
        </div>

        <div class="dp-divider"></div>

        <!-- Event Watermark, REC Timecode & GPS Status Lock -->
        <div class="cp-section cp-meta">
          <div class="watermark-title" id="watermark-event-title">24H LEMONS • SONOMA</div>
          <div class="watermark-sub">
            <span class="rec-indicator"><span class="rec-dot"></span>REC</span>
            <span>&bull;</span>
            <span id="live-timecode-val">00:00:00 UTC</span>
          </div>
          <span class="gps-lock-badge" id="gps-status-pill">DB GPS LOCK</span>
        </div>

      </div>

      <!-- 3. Bottom-Right Cluster: Minimalist Floating G-Meter + Satellite GPS Map Window -->
      <div class="bottom-right-cluster">
        
        <!-- Minimalist Floating Friction Circle (No square background) -->
        <div class="g-meter-minimal">
          <canvas id="g-canvas" width="104" height="104"></canvas>
          <div class="g-minimal-readout">
            <span id="g-val-text">0.0 G</span>
            <span class="g-minimal-peak" id="g-peak-val">1.2G</span>
          </div>
        </div>

        <!-- Small Google Maps Style Window in Corner (Satellite Live GPS Map) -->
        <div class="live-map-panel">
          <div class="live-map-header">
            <span class="live-map-title">📍 GPS MAP</span>
            <span class="live-map-coords" id="live-map-coords">38.1607°, -122.4547°</span>
          </div>
          <div id="live-gps-map"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- ==================== SETTINGS FLYOUT DRAWER ==================== -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="settings-drawer" id="settings-drawer">
    <div class="drawer-header">
      <span class="drawer-title">⚙️ Streamlabs Overlay Settings</span>
      <button class="btn-close" id="btn-close-drawer" type="button">✕</button>
    </div>

    <!-- Active Driver Control -->
    <div class="form-group">
      <label class="form-label">Active Driver</label>
      <select class="form-select" id="cfg-driver">
        <option value="MATT">Matt</option>
        <option value="DAVE">Dave</option>
        <option value="CHRIS">Chris</option>
        <option value="IN PITS">In Pits / Standby</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Car Number & Event Title</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" class="form-input" id="cfg-car-number" value="#42" style="width: 70px; text-align: center;" />
        <input type="text" class="form-input" id="cfg-event-title" value="24 HOURS OF LEMONS • SONOMA RACEWAY" style="flex: 1;" />
      </div>
    </div>

    <!-- Driver Laps & Team Laps Manual Adjust -->
    <div class="form-group">
      <label class="form-label">Lap Counts (Driver Stint / Team Total)</label>
      <div style="display: flex; gap: 8px;">
        <input type="number" class="form-input" id="cfg-driver-laps" value="15" style="flex: 1;" placeholder="Driver Laps" />
        <input type="number" class="form-input" id="cfg-team-laps" value="87" style="flex: 1;" placeholder="Team Total" />
      </div>
    </div>

    <!-- Stint Reset -->
    <button class="drawer-btn" id="btn-reset-stint" type="button">
      <span>⏱️ Restart Driver Stint Clock</span>
    </button>

    <div class="btn-row">
      <button class="drawer-btn" id="btn-zero-g" type="button">
        <span>🎯 Zero G-Force (Calibrate Gravity)</span>
      </button>
      <button class="drawer-btn" id="btn-toggle-demo" type="button">
        <span>🏎️ Demo Simulation</span>
      </button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    // --- DOM REFERENCES ---
    const btnOpenSettings = document.getElementById("btn-open-settings");
    const drawerOverlay = document.getElementById("drawer-overlay");
    const settingsDrawer = document.getElementById("settings-drawer");
    const btnCloseDrawer = document.getElementById("btn-close-drawer");

    const carNumberBadge = document.getElementById("car-number-badge");
    const watermarkEventTitle = document.getElementById("watermark-event-title");
    const liveTimecodeVal = document.getElementById("live-timecode-val");
    const gpsStatusPill = document.getElementById("gps-status-pill");

    // Driver Pill Elements
    const dpDriverName = document.getElementById("dp-driver-name");
    const dpStatus = document.getElementById("dp-status");
    const speedDigits = document.getElementById("speed-digits");
    const stintBox = document.getElementById("stint-box");
    const stintClockVal = document.getElementById("stint-clock-val");
    const stintBarFill = document.getElementById("stint-bar-fill");
    const stintAlertText = document.getElementById("stint-alert-text");
    const stintRemainText = document.getElementById("stint-remain-text");
    const driverLapsVal = document.getElementById("driver-laps-val");
    const teamLapsVal = document.getElementById("team-laps-val");

    // Lap Timer Elements
    const runningLapClock = document.getElementById("running-lap-clock");
    const lastLapVal = document.getElementById("last-lap-val");
    const bestLapVal = document.getElementById("best-lap-val");

    // Friction Circle Elements
    const gCanvas = document.getElementById("g-canvas");
    const gCtx = gCanvas.getContext("2d");
    const gValText = document.getElementById("g-val-text");
    const gPeakVal = document.getElementById("g-peak-val");

    // Live GPS Map Elements
    const liveMapCoords = document.getElementById("live-map-coords");

    // Settings Drawer Elements
    const cfgDriver = document.getElementById("cfg-driver");
    const cfgCarNumber = document.getElementById("cfg-car-number");
    const cfgEventTitle = document.getElementById("cfg-event-title");
    const cfgDriverLaps = document.getElementById("cfg-driver-laps");
    const cfgTeamLaps = document.getElementById("cfg-team-laps");
    const btnResetStint = document.getElementById("btn-reset-stint");
    const btnZeroG = document.getElementById("btn-zero-g");
    const btnToggleDemo = document.getElementById("btn-toggle-demo");

    // --- STATE & TELEMETRY VARIABLES ---
    let activeDriver = "MATT";
    let carNumber = "#42";
    let eventTitle = "24 HOURS OF LEMONS • SONOMA RACEWAY";

    let stintStartTime = Date.now() - (62 * 60 * 1000); // 62 mins into stint
    const MAX_STINT_MS = 2 * 60 * 60 * 1000; // 2 hours max stint

    let driverLaps = 15;
    let teamLaps = 87;

    let currentLap = 14;
    let lapStartTime = Date.now() - 48000;
    let lastLapMs = 113400; // 1:53.40
    let bestLapMs = 111150; // 1:51.15

    let targetSpeedMph = 0;
    let smoothSpeedMph = 0;
    const SPEED_CUTOFF_MPH = 2.5;

    // --- VERTICAL LANDSCAPE G-FORCE CALIBRATION ---
    let rawLateralG = 0;
    let rawLongitudinalG = 0;
    let smoothLateralG = 0;
    let smoothLongitudinalG = 0;
    let peakG = 1.2;

    const gHistory = [];
    const COMET_WINDOW_MS = 2000; // 2-second comet trail

    let isDemoMode = false;

    // --- INITIALIZE LEAFLET SATELLITE GPS MAP ---
    const initialLat = 38.16071;
    const initialLon = -122.45472;
    let targetLat = initialLat;
    let targetLon = initialLon;
    let currentMapLat = initialLat;
    let currentMapLon = initialLon;

    const liveMap = L.map('live-gps-map', {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false
    }).setView([initialLat, initialLon], 16);

    // Esri World Imagery Satellite Tiles
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(liveMap);

    // Google Maps Style Pulsing GPS Puck
    const gpsPuckIcon = L.divIcon({
      className: 'gps-puck-container',
      html: '<div class="gps-puck-radar"></div><div class="gps-puck-core"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });
    const carGpsMarker = L.marker([initialLat, initialLon], { icon: gpsPuckIcon }).addTo(liveMap);

    // GPS Breadcrumb Path
    const gpsBreadcrumbs = L.polyline([[initialLat, initialLon]], {
      color: '#ea580c',
      weight: 3.5,
      opacity: 0.90,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(liveMap);

    // Ensure map tiles render without gray tile glitch
    setTimeout(() => {
      liveMap.invalidateSize();
    }, 250);

    // --- SONOMA RACEWAY ROAD COURSE GEOMETRY (DEMO) ---
    const SONOMA_COORDS = [
      [38.16071, -122.45472], // Start/Finish
      [38.16390, -122.45520], // Turn 1 (Uphill)
      [38.16615, -122.45710], // Turn 2 (Crest)
      [38.16520, -122.45930], // Turn 3 / 3a
      [38.16270, -122.46110], // Turn 4 (Sector 1 Gate)
      [38.16030, -122.46280], // Turn 5 (Carousel Entry)
      [38.15740, -122.46260], // Turn 6 (Carousel Exit)
      [38.15780, -122.45830], // Turn 7 Hairpin (Sector 2 Gate)
      [38.15930, -122.45680], // Turn 8 / 8a (Esses)
      [38.16100, -122.45610], // Turn 9 (Esses Exit)
      [38.16290, -122.45550], // Turn 10 (Speed Trap)
      [38.15960, -122.45445], // Turn 11 (Hairpin)
      [38.16071, -122.45472]  // Main Straight
    ];

    // --- TIME FORMATTING UTILITIES ---
    function formatTimeMs(ms) {
      if (ms <= 0 || isNaN(ms)) return "00:00.00";
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const hs = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(hs).padStart(2, '0')}`;
    }

    function formatHoursMs(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // --- 60 FPS MAIN RENDER LOOP ---
    function render() {
      const now = Date.now();

      // 1. Live UTC Timecode Clock
      const d = new Date();
      liveTimecodeVal.textContent = d.toISOString().substring(11, 19) + " UTC";

      // 2. Demo Simulation Progression
      if (isDemoMode) {
        runDemoSimulation(now);
      }

      // 3. Smooth Speed Transitions (Continuous 60FPS Lerp between 1Hz GPS Packets)
      if (targetSpeedMph === 0) {
        smoothSpeedMph += (0 - smoothSpeedMph) * 0.20;
        if (smoothSpeedMph < 0.3) smoothSpeedMph = 0;
      } else {
        smoothSpeedMph += (targetSpeedMph - smoothSpeedMph) * 0.08;
      }
      speedDigits.textContent = Math.round(smoothSpeedMph);

      // Smooth Map Follow-Cam & Car Puck (Continuous 60FPS Glide between 1Hz GPS Fixes)
      const latDelta = targetLat - currentMapLat;
      const lonDelta = targetLon - currentMapLon;
      if (Math.abs(latDelta) > 0.0000001 || Math.abs(lonDelta) > 0.0000001) {
        if (Math.abs(latDelta) > 0.01 || Math.abs(lonDelta) > 0.01) {
          currentMapLat = targetLat;
          currentMapLon = targetLon;
        } else {
          currentMapLat += latDelta * 0.07;
          currentMapLon += lonDelta * 0.07;
        }
        carGpsMarker.setLatLng([currentMapLat, currentMapLon]);
        liveMap.panTo([currentMapLat, currentMapLon], { animate: false });
      }

      // 4. Stint Clock & 2-Hour Limit Countdown Bar
      const stintElapsed = Math.max(0, now - stintStartTime);
      stintClockVal.textContent = formatHoursMs(stintElapsed);

      const stintRemainMs = Math.max(0, MAX_STINT_MS - stintElapsed);
      const stintPct = Math.min(100, (stintElapsed / MAX_STINT_MS) * 100);
      stintBarFill.style.width = `${stintPct}%`;

      const remainMinutes = Math.floor(stintRemainMs / 60000);
      if (remainMinutes <= 5) {
        stintBarFill.className = "stint-bar-fill alert-red";
        stintAlertText.textContent = "🚨 BOX THIS LAP";
        stintAlertText.style.color = "#ef4444";
        stintRemainText.textContent = `${remainMinutes}m REM`;
      } else if (remainMinutes <= 20) {
        stintBarFill.className = "stint-bar-fill warn-amber";
        stintAlertText.textContent = "⚠️ PIT WINDOW OPEN";
        stintAlertText.style.color = "#facc15";
        stintRemainText.textContent = `${remainMinutes}m REM`;
      } else {
        stintBarFill.className = "stint-bar-fill";
        stintAlertText.textContent = "NORMAL STINT";
        stintAlertText.style.color = "#cbd5e1";
        const hRem = Math.floor(remainMinutes / 60);
        const mRem = remainMinutes % 60;
        stintRemainText.textContent = `${hRem}h ${mRem}m REM`;
      }

      // 5. Driver Laps & Team Total Laps Readouts
      driverLapsVal.textContent = driverLaps;
      teamLapsVal.textContent = teamLaps;

      // 6. Running Lap Timer
      const lapElapsed = Math.max(0, now - lapStartTime);
      runningLapClock.textContent = formatTimeMs(lapElapsed);

      // 7. Friction Circle G-Meter with 2-Second Retention Comet Tail
      renderFrictionCircle(now);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // --- FRICTION CIRCLE (G-G) MINIMALIST COMET TAIL RENDERER ---
    function renderFrictionCircle(now) {
      const w = gCanvas.width;
      const h = gCanvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const maxRadius = w * 0.42; // 1.5G boundary

      gCtx.clearRect(0, 0, w, h);

      // Subtle dark circular vignette backing so reticle pops over daylight track or dark cockpit
      gCtx.beginPath();
      gCtx.arc(cx, cy, maxRadius + 2, 0, Math.PI * 2);
      gCtx.fillStyle = "rgba(10, 15, 29, 0.52)";
      gCtx.fill();

      // Outer 1.0G Circle (Solid thin boundary)
      const r1G = (1.0 / 1.5) * maxRadius;
      gCtx.beginPath();
      gCtx.arc(cx, cy, r1G, 0, Math.PI * 2);
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.45)";
      gCtx.lineWidth = 1.2;
      gCtx.stroke();

      // Inner 0.5G Dashed Circle
      const rHalfG = (0.5 / 1.5) * maxRadius;
      gCtx.beginPath();
      gCtx.arc(cx, cy, rHalfG, 0, Math.PI * 2);
      gCtx.setLineDash([2, 3]);
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      gCtx.lineWidth = 1;
      gCtx.stroke();
      gCtx.setLineDash([]);

      // Minimal Crosshairs with Center Notch
      gCtx.beginPath();
      // Horizontal
      gCtx.moveTo(cx - maxRadius, cy);
      gCtx.lineTo(cx - 5, cy);
      gCtx.moveTo(cx + 5, cy);
      gCtx.lineTo(cx + maxRadius, cy);
      // Vertical
      gCtx.moveTo(cx, cy - maxRadius);
      gCtx.lineTo(cx, cy - 5);
      gCtx.moveTo(cx, cy + 5);
      gCtx.lineTo(cx, cy + maxRadius);
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      gCtx.lineWidth = 1;
      gCtx.stroke();

      // Minimal Cardinal Indicators (B, A, L, R)
      gCtx.font = "800 7px ui-monospace, sans-serif";
      gCtx.textAlign = "center";
      gCtx.textBaseline = "top";
      gCtx.fillStyle = "#ef4444"; // Brake Red
      gCtx.fillText("B", cx, 2);

      gCtx.textBaseline = "bottom";
      gCtx.fillStyle = "#22c55e"; // Accel Green
      gCtx.fillText("A", cx, h - 2);

      gCtx.textBaseline = "middle";
      gCtx.fillStyle = "rgba(255, 255, 255, 0.55)";
      gCtx.fillText("L", 4, cy);
      gCtx.fillText("R", w - 4, cy);

      // Smooth G-Force Lerp (Continuous fluid movement between 1Hz accelerometer ticks)
      smoothLateralG += (rawLateralG - smoothLateralG) * 0.10;
      smoothLongitudinalG += (rawLongitudinalG - smoothLongitudinalG) * 0.10;

      const curGx = Math.max(-1.5, Math.min(1.5, smoothLateralG));
      const curGy = Math.max(-1.5, Math.min(1.5, smoothLongitudinalG));

      const activePx = cx + (curGx / 1.5) * maxRadius;
      const activePy = cy - (curGy / 1.5) * maxRadius;

      // Append to 2-second comet trail
      gHistory.push({ x: activePx, y: activePy, time: now });

      while (gHistory.length > 0 && (now - gHistory[0].time) > COMET_WINDOW_MS) {
        gHistory.shift();
      }

      if (gHistory.length > 1) {
        for (let i = 0; i < gHistory.length - 1; i++) {
          const p1 = gHistory[i];
          const p2 = gHistory[i + 1];
          const age = now - p1.time;
          const alpha = Math.max(0, 1 - (age / COMET_WINDOW_MS)) * 0.85;

          gCtx.beginPath();
          gCtx.moveTo(p1.x, p1.y);
          gCtx.lineTo(p2.x, p2.y);
          gCtx.strokeStyle = `rgba(249, 115, 22, ${alpha})`;
          gCtx.lineWidth = 2.4 * (1 - age / COMET_WINDOW_MS);
          gCtx.lineCap = "round";
          gCtx.stroke();
        }
      }

      // Draw Active G-Dot
      gCtx.beginPath();
      gCtx.arc(activePx, activePy, 4.5, 0, Math.PI * 2);
      gCtx.fillStyle = "#ffffff";
      gCtx.shadowColor = "#f97316";
      gCtx.shadowBlur = 8;
      gCtx.fill();
      gCtx.shadowBlur = 0;

      const totalG = Math.sqrt(curGx * curGx + curGy * curGy);
      if (totalG > peakG) {
        peakG = parseFloat(totalG.toFixed(1));
        gPeakVal.textContent = `${peakG.toFixed(1)}G`;
      }
      gValText.textContent = `${totalG.toFixed(1)} G`;
    }

    // --- LIVE GPS POSITION UPDATER (FOLLOW-CAM & BREADCRUMBS) ---
    function updateGpsPosition(lat, lon) {
      if (!lat || !lon || isNaN(lat) || isNaN(lon)) return;
      targetLat = lat;
      targetLon = lon;
      liveMapCoords.textContent = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;

      // Update path breadcrumbs (keep last 60 points)
      gpsBreadcrumbs.addLatLng([lat, lon]);
      const latLngs = gpsBreadcrumbs.getLatLngs();
      if (latLngs.length > 60) {
        latLngs.shift();
        gpsBreadcrumbs.setLatLngs(latLngs);
      }
    }

    // --- DEMO SIMULATION ENGINE ---
    function runDemoSimulation(now) {
      const loopDuration = 112000;
      const t = (now % loopDuration) / loopDuration;

      const totalPoints = SONOMA_COORDS.length - 1;
      const indexFloat = t * totalPoints;
      const idx1 = Math.floor(indexFloat);
      const idx2 = (idx1 + 1) % SONOMA_COORDS.length;
      const frac = indexFloat - idx1;

      const p1 = SONOMA_COORDS[idx1];
      const p2 = SONOMA_COORDS[idx2];
      const curLat = p1[0] + (p2[0] - p1[0]) * frac;
      const curLon = p1[1] + (p2[1] - p1[1]) * frac;

      updateGpsPosition(curLat, curLon);

      targetSpeedMph = Math.round(58 + 32 * Math.cos(t * Math.PI * 6));
      if (targetSpeedMph < 32) targetSpeedMph = 32;

      rawLateralG = Math.sin(t * Math.PI * 12) * 1.15;
      rawLongitudinalG = Math.cos(t * Math.PI * 8) * 0.95;
    }

    // --- FIREBASE LIVE INGESTION WITH HYBRID WEBSOCKET + REST FALLBACK ---
    let lastDbPacketTime = 0;
    let prevServerGpsTime = 0;
    let lastFreshDataWallTime = 0;
    const FIREBASE_REST_URL = "https://fiero-telemetry-default-rtdb.firebaseio.com/raceTelemetry.json";

    function ingestTelemetryRoot(root) {
      if (!root || isDemoMode) return;

      const now = Date.now();
      lastDbPacketTime = now;

      // 1. Driver Name & Status from Firebase
      const driver = root.driver || (root.autox && root.autox.driver) || activeDriver;
      if (driver && driver.toUpperCase() !== activeDriver) {
        activeDriver = driver.toUpperCase();
        dpDriverName.textContent = activeDriver;
        cfgDriver.value = activeDriver;
      }

      // Live Status update from Pit Wall text box
      const statusText = (root.statusText || root.status || root.notes || (root.autox && (root.autox.statusText || root.autox.status || root.autox.notes)) || "").trim();
      if (statusText) {
        dpStatus.textContent = statusText.toUpperCase();
        dpStatus.style.display = "inline-block";
      } else {
        dpStatus.textContent = "ON TRACK";
      }

      // 2. Lap Counts (Driver Stint & Team Total)
      if (root.driverLaps !== undefined) driverLaps = Number(root.driverLaps);
      else if (root.autox && root.autox.runNum) driverLaps = Number(root.autox.runNum);

      if (root.teamLaps !== undefined) teamLaps = Number(root.teamLaps);
      else if (root.laps && Array.isArray(root.laps)) teamLaps = root.laps.length;

      // 3. Telemetry Ingestion (Speed, Lat/Lon, G-Force)
      let telem = root;
      if (root.lat === undefined && root.latitude === undefined) {
        const keys = Object.keys(root).filter(k => typeof root[k] === 'object' && root[k] !== null && k !== 'autox');
        if (keys.length > 0) {
          telem = root[keys[keys.length - 1]];
        }
      }

      // Capture Server GPS Timestamp for True Freshness Detection
      const ts = Number(telem.lastGpsTimestamp || telem.deviceTimestamp || (telem.tst ? telem.tst * 1000 : 0));
      if (ts && ts > 0) {
        if (prevServerGpsTime === 0) {
          // Initial packet on load: only fresh if recent (< 5s)
          if (Math.abs(now - ts) < 5000) {
            lastFreshDataWallTime = now;
          }
          prevServerGpsTime = ts;
        } else if (ts !== prevServerGpsTime) {
          // New packet timestamp received from server: actively streaming!
          prevServerGpsTime = ts;
          lastFreshDataWallTime = now;
        } else if (Math.abs(now - ts) < 4000) {
          lastFreshDataWallTime = now;
        }
      } else {
        lastFreshDataWallTime = now;
      }

      // Speed from Database
      let calcMph = 0;
      if (telem.speed !== undefined && telem.speed !== null) {
        calcMph = Number(telem.speed);
      } else if (telem.vel !== undefined && telem.vel !== null) {
        calcMph = Number(telem.vel) * 0.621371;
      }
      if (calcMph < SPEED_CUTOFF_MPH || isNaN(calcMph)) calcMph = 0;
      targetSpeedMph = calcMph;

      // G-Force from Database (Sensor Logger 3-axis or 2-axis)
      if (telem.latG !== undefined && telem.longG !== undefined) {
        rawLateralG = Number(telem.latG);
        rawLongitudinalG = Number(telem.longG);
      } else if (telem.ax !== undefined || telem.ay !== undefined) {
        const ax = Number(telem.ax || 0);
        const ay = Number(telem.ay || 0);
        const az = Number(telem.az || 0);
        if (Math.abs(az) > 0.1 && Math.abs(ay) > 0.1) {
          rawLateralG = ay / 9.81;
          rawLongitudinalG = az / 9.81;
        } else {
          rawLateralG = ax / 9.81;
          rawLongitudinalG = ay / 9.81;
        }
      }

      // Live GPS Position from Database
      const lat = Number(telem.latitude || telem.lat);
      const lon = Number(telem.longitude || telem.lon);
      if (lat && lon && lat !== 0 && lon !== 0) {
        updateGpsPosition(lat, lon);
      }

      checkGpsStatusFreshness();
    }

    // 1. Primary Realtime WebSocket Listener
    db.on("value", (snap) => {
      ingestTelemetryRoot(snap.val());
    });

    // 2. HTTP REST Polling Fallback (Bypasses WebSocket sleep/hang in mobile WebViews)
    let isFetchingFallback = false;
    async function fetchTelemetryFallback() {
      if (isFetchingFallback || isDemoMode) return;
      isFetchingFallback = true;
      try {
        const res = await fetch(FIREBASE_REST_URL, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          ingestTelemetryRoot(data);
        }
      } catch (e) {
      } finally {
        isFetchingFallback = false;
      }
    }

    // Check freshness & update status pill (Green / Yellow / Red)
    function checkGpsStatusFreshness() {
      if (isDemoMode) return;
      const now = Date.now();
      const age = lastFreshDataWallTime ? (now - lastFreshDataWallTime) : Infinity;

      if (age < 4000) {
        gpsStatusPill.textContent = "DB GPS LOCK";
        gpsStatusPill.style.color = "#4ade80";
      } else if (age < 8000) {
        gpsStatusPill.textContent = "DB DELAY";
        gpsStatusPill.style.color = "#facc15";
      } else {
        gpsStatusPill.textContent = "WAITING FOR DB";
        gpsStatusPill.style.color = "#f87171";
      }
    }

    // Watchdog: runs every 1000ms. Checks freshness and polls REST if fresh data hasn't arrived in > 2000ms
    setInterval(() => {
      checkGpsStatusFreshness();
      const now = Date.now();
      if (!isDemoMode && (!lastFreshDataWallTime || (now - lastFreshDataWallTime) > 2000)) {
        fetchTelemetryFallback();
      }
    }, 1000);

    // Immediate auto-reconnect when app is resumed / focused (e.g. returning from Sensor Logger app)
    function handleAppWakeup() {
      if (typeof firebase !== "undefined" && firebase.database) {
        try { firebase.database().goOnline(); } catch (e) {}
      }
      fetchTelemetryFallback();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") handleAppWakeup();
    });
    window.addEventListener("focus", handleAppWakeup);
    window.addEventListener("pageshow", handleAppWakeup);

    // Monitor Firebase Connection State
    firebase.database().ref(".info/connected").on("value", (snap) => {
      const connected = !!snap.val();
      if (!connected && !isDemoMode) {
        try { firebase.database().goOnline(); } catch (e) {}
        fetchTelemetryFallback();
      }
    });

    // Zero G-Force Calibration
    btnZeroG.addEventListener("click", () => {
      peakG = 0;
      smoothLateralG = 0;
      smoothLongitudinalG = 0;
      rawLateralG = 0;
      rawLongitudinalG = 0;
      gPeakVal.textContent = "0.0G";
      closeDrawer();
    });

    // --- SETTINGS DRAWER CONTROLS ---
    function openDrawer() {
      drawerOverlay.classList.add("open");
      settingsDrawer.classList.add("open");
    }
    function closeDrawer() {
      drawerOverlay.classList.remove("open");
      settingsDrawer.classList.remove("open");
    }

    btnOpenSettings.addEventListener("click", openDrawer);
    btnCloseDrawer.addEventListener("click", closeDrawer);
    drawerOverlay.addEventListener("click", closeDrawer);

    cfgDriver.addEventListener("change", (e) => {
      activeDriver = e.target.value;
      dpDriverName.textContent = activeDriver;
      stintStartTime = Date.now();
      driverLaps = 0;
    });

    cfgCarNumber.addEventListener("input", (e) => {
      carNumberBadge.textContent = e.target.value;
    });

    cfgEventTitle.addEventListener("input", (e) => {
      watermarkEventTitle.textContent = e.target.value.toUpperCase();
    });

    cfgDriverLaps.addEventListener("input", (e) => {
      driverLaps = parseInt(e.target.value) || 0;
    });

    cfgTeamLaps.addEventListener("input", (e) => {
      teamLaps = parseInt(e.target.value) || 0;
    });

    btnResetStint.addEventListener("click", () => {
      stintStartTime = Date.now();
      driverLaps = 0;
      closeDrawer();
    });

    btnToggleDemo.addEventListener("click", () => {
      isDemoMode = !isDemoMode;
      btnToggleDemo.classList.toggle("active", isDemoMode);
      if (isDemoMode) {
        lapStartTime = Date.now();
        stintStartTime = Date.now() - (75 * 60 * 1000);
      }
      closeDrawer();
    });

    // --- URL PARAMETERS AUTO-CONFIGURATION ---
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("demo") === "1" || urlParams.get("demo") === "true") {
      isDemoMode = true;
      btnToggleDemo.classList.add("active");
      lapStartTime = Date.now();
      stintStartTime = Date.now() - (75 * 60 * 1000);
    }
    if (urlParams.get("driver")) {
      activeDriver = urlParams.get("driver").toUpperCase();
      dpDriverName.textContent = activeDriver;
      cfgDriver.value = activeDriver;
    }
    if (urlParams.get("car")) {
      const c = urlParams.get("car");
      carNumberBadge.textContent = c.startsWith("#") ? c : `#${c}`;
      cfgCarNumber.value = carNumberBadge.textContent;
    }
    if (urlParams.get("event")) {
      watermarkEventTitle.textContent = urlParams.get("event").toUpperCase();
      cfgEventTitle.value = watermarkEventTitle.textContent;
    }
    if (urlParams.get("driverLaps")) {
      driverLaps = parseInt(urlParams.get("driverLaps")) || driverLaps;
      cfgDriverLaps.value = driverLaps;
    }
    if (urlParams.get("teamLaps")) {
      teamLaps = parseInt(urlParams.get("teamLaps")) || teamLaps;
      cfgTeamLaps.value = teamLaps;
    }
  </script>
</body>
</html>
