<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Control Tower & Event Manager — Race Telemetry [PREPRO]</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #070a13;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      max-width: 820px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Brand Bar */
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .badge-prepro {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #9333ea, #db2777);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(219, 39, 119, 0.4);
    }
    .page-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    /* LIVE EVENT HERO CARD */
    .live-hero-card {
      background: #0f172a;
      border: 2px solid #22c55e;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(34, 197, 94, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeIn 0.2s ease-out;
    }
    .live-hero-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #22c55e, #38bdf8, #a855f7);
    }
    .live-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
      width: fit-content;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .live-hero-content {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }
    .live-event-name {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
    }
    .live-event-track {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-meta-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #cbd5e1;
      background: #020617;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .meta-stat strong {
      color: #38bdf8;
      font-weight: 800;
    }

    .live-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }
    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      cursor: pointer;
      text-align: center;
    }
    .btn-action:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      transform: translateY(-2px);
    }
    .btn-action-primary {
      background: #ea580c;
      border-color: #ea580c;
    }
    .btn-action-primary:hover {
      background: #c2410c;
      border-color: #c2410c;
    }
    .btn-action-archive {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
    }
    .btn-action-archive:hover {
      border-color: #ef4444;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }

    /* IDLE HERO STATE */
    .idle-hero-card {
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ARCHIVE SECTION */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #f97316;
    }
    .btn-new-event {
      background: #2563eb;
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-new-event:hover { background: #1d4ed8; }

    .archive-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .archive-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      transition: all 0.15s ease;
    }
    .archive-card:hover {
      border-color: #475569;
      background: #111d35;
    }
    .archive-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .archive-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .archive-meta {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .archive-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-mini {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-mini:hover {
      border-color: #38bdf8;
      color: #fff;
    }
    .btn-mini-active {
      border-color: #22c55e;
      color: #4ade80;
    }
    .btn-mini-active:hover {
      background: #15803d;
      color: #fff;
    }

    /* START NEW EVENT MODAL */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 9999;
    }
    .modal-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-input, .form-select {
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: #38bdf8; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-bar">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="badge-prepro">🧪 PREPRO CONTROL TOWER</span>
        <h1 class="page-title">Race Telemetry Hub</h1>
      </div>
      <a href="../analysis.html" style="color:#38bdf8; font-size:12px; text-decoration:none; font-weight:700;">
        Go to Production Root →
      </a>
    </div>

    <!-- LIVE EVENT HERO CONTAINER -->
    <div id="hero-container">
      <div class="idle-hero-card">
        <div style="font-size: 32px;">⏳</div>
        <div style="font-size: 16px; font-weight: 800;">Connecting to Telemetry Cloud...</div>
      </div>
    </div>

    <!-- ARCHIVE VAULT SECTION -->
    <div class="section-header">
      <span class="section-title">📁 Event Archive Vault</span>
      <button type="button" class="btn-new-event" onclick="openNewEventModal()">
        + Start New Event
      </button>
    </div>

    <div class="archive-list" id="archive-list">
      <div style="text-align: center; color: #64748b; padding: 20px;">Loading archive events...</div>
    </div>
  </div>

  <!-- START NEW EVENT MODAL -->
  <div class="modal-backdrop" id="new-event-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">🚀 Start New Race Event</span>
        <button type="button" class="btn-close" onclick="closeNewEventModal()">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Event Name</label>
        <input type="text" id="input-event-name" class="form-input" placeholder="e.g. Thunderhill West AutoX" required />
      </div>

      <div class="form-group">
        <label class="form-label">Track / Venue</label>
        <input type="text" id="input-event-track" class="form-input" placeholder="e.g. Thunderhill Raceway (Paddock 2)" required />
      </div>

      <div class="form-group">
        <label class="form-label">Format</label>
        <select id="input-event-format" class="form-select">
          <option value="autocross">Autocross (Point-to-Point Timing)</option>
          <option value="trackday">Road Course (Closed Loop Laps)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-mini" style="padding: 10px 16px;" onclick="closeNewEventModal()">Cancel</button>
        <button type="button" class="btn-action btn-action-primary" style="padding: 10px 20px;" onclick="submitNewEvent()">
          🏁 Launch Event & Set Live
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- FIREBASE SETUP ---
    const firebaseConfig = {
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      storageBucket: "fiero-telemetry.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    let currentActiveEvent = null;
    let allEvents = {};

    function sanitizeKey(str) {
      return (str || "").toLowerCase().replace(/[^a-z0-9]/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "event";
    }

    // 1. Listen to Global Active Event Pointer
    db.child("activeEvent").on("value", (snap) => {
      currentActiveEvent = snap.val();
      renderHero();
      renderArchive();
    });

    // 2. Listen to All Events
    db.child("events").on("value", (snap) => {
      allEvents = snap.val() || {};
      // Ensure Sunday Autocross is represented if missing
      if (!allEvents["sunday_autocross"]) {
        allEvents["sunday_autocross"] = {
          meta: {
            id: "sunday_autocross",
            name: "Sunday Autocross",
            track: "Sonoma Raceway",
            format: "autocross",
            status: "LIVE",
            startedAt: 1789310000000
          }
        };
      }
      renderHero();
      renderArchive();
    });

    function renderHero() {
      const container = document.getElementById("hero-container");
      if (!currentActiveEvent || currentActiveEvent.status === "ARCHIVED") {
        container.innerHTML = `
          <div class="idle-hero-card">
            <div style="font-size: 32px;">🏁</div>
            <div style="font-size: 18px; font-weight: 800; color: #fff;">No Live Event Active</div>
            <p style="color: #94a3b8; font-size: 13px; max-width: 440px;">
              Ready for your next track session? Create an event to begin streaming telemetry, or select a previous event from the archive below.
            </p>
            <button type="button" class="btn-action btn-action-primary" style="margin-top: 8px;" onclick="openNewEventModal()">
              🚀 + Start New Event
            </button>
          </div>
        `;
        return;
      }

      const eventKey = currentActiveEvent.id;
      const eventData = allEvents[eventKey] || {};
      const runs = eventData.runs ? Object.values(eventData.runs) : [];
      const cleanRuns = runs.filter(r => !r.isDnf);
      cleanRuns.sort((a, b) => a.finalTimeMs - b.finalTimeMs);
      const bestRun = cleanRuns[0];

      container.innerHTML = `
        <div class="live-hero-card">
          <div class="live-status-pill">
            <div class="live-dot"></div>
            <span>LIVE ACTIVE SESSION</span>
          </div>

          <div class="live-hero-content">
            <div>
              <div class="live-event-name">${currentActiveEvent.name || "Live Session"}</div>
              <div class="live-event-track">📍 ${currentActiveEvent.track || "Track"} &bull; Format: ${currentActiveEvent.format || "Autocross"}</div>
            </div>
          </div>

          <div class="live-meta-row">
            <div class="meta-stat">Runs Recorded: <strong>${runs.length}</strong></div>
            <div class="meta-stat">Fastest Time: <strong>${bestRun ? bestRun.finalFormatted + ' (' + bestRun.driver + ')' : '--:--.--'}</strong></div>
            <div class="meta-stat">Started: <strong>${new Date(currentActiveEvent.startedAt || Date.now()).toLocaleDateString([], { month: 'short', day: 'numeric' })}</strong></div>
          </div>

          <div class="live-actions-grid">
            <a href="pitwall.html" class="btn-action btn-action-primary">
              📋 Pit Wall Ledger
            </a>
            <a href="analysis.html" class="btn-action">
              🗺️ GPS Racing Lines
            </a>
            <a href="gates.html" class="btn-action">
              🏁 Course Gates
            </a>
            <button type="button" class="btn-action btn-action-archive" onclick="archiveCurrentEvent()">
              📦 End & Archive
            </button>
          </div>
        </div>
      `;
    }

    function renderArchive() {
      const list = document.getElementById("archive-list");
      const keys = Object.keys(allEvents);
      if (keys.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: #64748b; padding: 20px;">No events recorded yet.</div>`;
        return;
      }

      list.innerHTML = "";
      keys.forEach(key => {
        const ev = allEvents[key] || {};
        const meta = ev.meta || { id: key, name: key.replace(/_/g, ' '), track: 'Track' };
        const runs = ev.runs ? Object.values(ev.runs) : [];
        const cleanRuns = runs.filter(r => !r.isDnf);
        cleanRuns.sort((a, b) => a.finalTimeMs - b.finalTimeMs);
        const bestRun = cleanRuns[0];

        const isActive = currentActiveEvent && currentActiveEvent.id === key && currentActiveEvent.status !== "ARCHIVED";

        const card = document.createElement("div");
        card.className = "archive-card";
        card.innerHTML = `
          <div class="archive-info">
            <div class="archive-title">
              ${meta.name || key}
              ${isActive ? '<span style="color:#4ade80; font-size:11px; margin-left:6px;">[ACTIVE NOW]</span>' : ''}
            </div>
            <div class="archive-meta">
              <span>📍 ${meta.track || "Track"}</span>
              <span>•</span>
              <span>🏎️ ${runs.length} runs</span>
              <span>•</span>
              <span>🏆 ${bestRun ? bestRun.driver + ' (' + bestRun.finalFormatted + ')' : 'No times logged'}</span>
            </div>
          </div>

          <div class="archive-actions">
            <a href="pitwall.html?event=${key}" class="btn-mini">📋 View Ledger</a>
            <a href="analysis.html?event=${key}" class="btn-mini">🗺️ View Lines</a>
            ${!isActive ? `<button type="button" class="btn-mini btn-mini-active" onclick="setActiveEvent('${key}')">⚡ Set as Live</button>` : ''}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function setActiveEvent(key) {
      const ev = allEvents[key];
      const meta = (ev && ev.meta) ? ev.meta : { id: key, name: key.replace(/_/g, ' '), track: 'Track', format: 'autocross', startedAt: Date.now() };
      meta.status = "LIVE";

      // 1. Update Firebase pointer
      db.child("activeEvent").set(meta)
        .then(() => {
          // 2. Also inform Worker
          fetch('https://race-telemetry-worker.bazarkoj.workers.dev/api/events/active', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(meta)
          }).catch(() => {});
        });
    }

    function archiveCurrentEvent() {
      if (!currentActiveEvent) return;
      if (!confirm(`End session and archive "${currentActiveEvent.name}"? Telemetry will stop streaming to this session.`)) return;

      currentActiveEvent.status = "ARCHIVED";
      db.child("activeEvent").set(currentActiveEvent);
      if (allEvents[currentActiveEvent.id] && allEvents[currentActiveEvent.id].meta) {
        db.child("events").child(currentActiveEvent.id).child("meta").child("status").set("ARCHIVED");
      }
    }

    function openNewEventModal() {
      document.getElementById("new-event-modal").style.display = "flex";
      document.getElementById("input-event-name").focus();
    }
    function closeNewEventModal() {
      document.getElementById("new-event-modal").style.display = "none";
    }

    function submitNewEvent() {
      const name = document.getElementById("input-event-name").value.trim();
      const track = document.getElementById("input-event-track").value.trim();
      const format = document.getElementById("input-event-format").value;

      if (!name) { alert("Please enter an event name."); return; }
      const id = sanitizeKey(name) + "_" + Math.floor(Date.now() / 1000).toString().slice(-4);

      const newEvent = {
        id,
        name,
        track: track || "Track",
        format,
        status: "LIVE",
        startedAt: Date.now()
      };

      // 1. Set as active in Firebase
      db.child("activeEvent").set(newEvent);
      db.child("events").child(id).child("meta").set(newEvent)
        .then(() => {
          // 2. Update Worker
          fetch('https://race-telemetry-worker.bazarkoj.workers.dev/api/events/active', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newEvent)
          }).catch(() => {});

          closeNewEventModal();
          // 3. Take crew to Course Gates Calibrator to position start/finish
          window.location.href = "gates.html";
        })
        .catch(err => alert("Error starting event: " + err.message));
    }
  </script>
</body>
</html>
