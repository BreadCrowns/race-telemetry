<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Race Telemetry - G-Force Widget</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.45);
      --glass-bg: rgba(10, 15, 29, 0.90);
      --glass-border: rgba(255, 255, 255, 0.16);
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #38bdf8;
      --purple: #a855f7;
    }

    /* Streamlabs Transparent Background */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      position: fixed;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Minimalist Friction Circle (Responsive & Zero Distortion) */
    .g-meter-minimal {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 2px;
      user-select: none;
      box-sizing: border-box;
    }
    canvas#g-canvas {
      display: block;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
    }
    .g-minimal-readout {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      padding: 2px 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      font-weight: 800;
      color: #f8fafc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
      margin-top: 4px;
    }
    .g-minimal-peak {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
    }

    /* Subtle Quick Reset Button on Click */
    .g-meter-minimal:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Minimalist Floating Friction Circle (No square background) -->
  <div class="g-meter-minimal interactive" id="g-meter-box" title="Click to zero / reset peak G-Force">
    <canvas id="g-canvas" width="130" height="130"></canvas>
    <div class="g-minimal-readout">
      <span id="g-val-text">0.0 G</span>
      <span class="g-minimal-peak" id="g-peak-val">1.2G</span>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    // Friction Circle Elements
    const gCanvas = document.getElementById("g-canvas");
    const gCtx = gCanvas.getContext("2d");
    const gValText = document.getElementById("g-val-text");
    const gPeakVal = document.getElementById("g-peak-val");
    const gMeterBox = document.getElementById("g-meter-box");

    // Dynamic Responsive Resizing (Enforces 1:1 Aspect Ratio to Prevent Any Distortion)
    function resizeGCanvas() {
      const availW = window.innerWidth || 140;
      const availH = window.innerHeight || 160;
      const size = Math.max(60, Math.floor(Math.min(availW - 8, availH - 32)));

      const dpr = window.devicePixelRatio || 1;
      gCanvas.width = size * dpr;
      gCanvas.height = size * dpr;
      gCanvas.style.width = size + "px";
      gCanvas.style.height = size + "px";
    }
    window.addEventListener("resize", resizeGCanvas);
    resizeGCanvas();

    // --- VERTICAL LANDSCAPE G-FORCE CALIBRATION ---
    let rawLateralG = 0;
    let rawLongitudinalG = 0;
    let smoothLateralG = 0;
    let smoothLongitudinalG = 0;
    let peakG = 1.2;

    const gHistory = [];
    const COMET_WINDOW_MS = 2000; // 2-second comet trail

    let isDemoMode = false;

    // Zero G-Force / Reset Peak on Click
    gMeterBox.addEventListener("click", () => {
      peakG = 0;
      smoothLateralG = 0;
      smoothLongitudinalG = 0;
      rawLateralG = 0;
      rawLongitudinalG = 0;
      gPeakVal.textContent = "0.0G";
    });

    // --- 60 FPS ANIMATION LOOP ---
    function render() {
      const now = Date.now();

      if (isDemoMode) {
        runDemoSimulation(now);
      }

      // Render Friction Circle with 2-Second Comet Tail
      renderFrictionCircle(now);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // --- FRICTION CIRCLE (G-G) MINIMALIST COMET TAIL RENDERER ---
    function renderFrictionCircle(now) {
      const w = gCanvas.width;
      const h = gCanvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const maxRadius = w * 0.42; // 1.5G boundary
      const scaleRatio = w / 130;

      gCtx.clearRect(0, 0, w, h);

      // Subtle Dark Vignette
      const bgGrad = gCtx.createRadialGradient(cx, cy, 2, cx, cy, maxRadius * 1.05);
      bgGrad.addColorStop(0, "rgba(10, 15, 29, 0.45)");
      bgGrad.addColorStop(0.7, "rgba(10, 15, 29, 0.65)");
      bgGrad.addColorStop(1, "rgba(10, 15, 29, 0.85)");
      gCtx.fillStyle = bgGrad;
      gCtx.beginPath();
      gCtx.arc(cx, cy, maxRadius, 0, Math.PI * 2);
      gCtx.fill();

      // Thin Crosshairs with Center Notch
      const notch = Math.max(3, 5 * scaleRatio);
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.18)";
      gCtx.lineWidth = Math.max(1, 1 * scaleRatio);
      gCtx.setLineDash([]);
      gCtx.beginPath();
      gCtx.moveTo(cx - maxRadius, cy);
      gCtx.lineTo(cx - notch, cy);
      gCtx.moveTo(cx + notch, cy);
      gCtx.lineTo(cx + maxRadius, cy);
      gCtx.moveTo(cx, cy - maxRadius);
      gCtx.lineTo(cx, cy - notch);
      gCtx.moveTo(cx, cy + notch);
      gCtx.lineTo(cx, cy + maxRadius);
      gCtx.stroke();

      // 0.5G Inner Ring (Subtle Dash)
      const r05 = (0.5 / 1.5) * maxRadius;
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      gCtx.lineWidth = Math.max(1, 1 * scaleRatio);
      gCtx.setLineDash([3 * scaleRatio, 3 * scaleRatio]);
      gCtx.beginPath();
      gCtx.arc(cx, cy, r05, 0, Math.PI * 2);
      gCtx.stroke();
      gCtx.setLineDash([]);

      // 1.0G Primary Traction Circle
      const r10 = (1.0 / 1.5) * maxRadius;
      gCtx.strokeStyle = "rgba(249, 115, 22, 0.65)";
      gCtx.lineWidth = Math.max(1.5, 1.5 * scaleRatio);
      gCtx.beginPath();
      gCtx.arc(cx, cy, r10, 0, Math.PI * 2);
      gCtx.stroke();

      // 1.5G Outer Boundary
      gCtx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      gCtx.lineWidth = Math.max(1, 1 * scaleRatio);
      gCtx.beginPath();
      gCtx.arc(cx, cy, maxRadius, 0, Math.PI * 2);
      gCtx.stroke();

      // Cardinal Indicators (Minimalist B / A / L / R)
      const fontSize = Math.max(7, Math.round(8.5 * scaleRatio));
      const cardOffset = Math.max(5, 7 * scaleRatio);
      gCtx.font = `800 ${fontSize}px ui-monospace, sans-serif`;
      gCtx.fillStyle = "rgba(255, 255, 255, 0.45)";
      gCtx.textAlign = "center";
      gCtx.textBaseline = "middle";
      gCtx.fillText("B", cx, cy - maxRadius + cardOffset);
      gCtx.fillText("A", cx, cy + maxRadius - cardOffset);
      gCtx.fillText("L", cx - maxRadius + cardOffset, cy);
      gCtx.fillText("R", cx + maxRadius - cardOffset, cy);

      // Smooth G-Force Momentum Lerp
      smoothLateralG += (rawLateralG - smoothLateralG) * 0.10;
      smoothLongitudinalG += (rawLongitudinalG - smoothLongitudinalG) * 0.10;

      // Map to Pixel Coordinates (Scale: 1.5G = maxRadius)
      const px = cx + (smoothLateralG / 1.5) * maxRadius;
      const py = cy - (smoothLongitudinalG / 1.5) * maxRadius;

      // Add Current Position to Comet History
      gHistory.push({ x: px, y: py, t: now });
      while (gHistory.length > 0 && (now - gHistory[0].t) > COMET_WINDOW_MS) {
        gHistory.shift();
      }

      // Render 2-Second Comet Tail
      if (gHistory.length > 1) {
        for (let i = 1; i < gHistory.length; i++) {
          const pPrev = gHistory[i - 1];
          const pCurr = gHistory[i];
          const age = now - pCurr.t;
          const life = Math.max(0, 1 - (age / COMET_WINDOW_MS));

          gCtx.strokeStyle = `rgba(249, 115, 22, ${(life * 0.65).toFixed(3)})`;
          gCtx.lineWidth = Math.max(1, (1 + life * 2.5) * scaleRatio);
          gCtx.beginPath();
          gCtx.moveTo(pPrev.x, pPrev.y);
          gCtx.lineTo(pCurr.x, pCurr.y);
          gCtx.stroke();
        }
      }

      // Current G-Force Puck (High-Intensity Neon Core)
      const glowR = Math.max(6, 10 * scaleRatio);
      const coreR = Math.max(2.5, 3.5 * scaleRatio);
      const puckGlow = gCtx.createRadialGradient(px, py, 1, px, py, glowR);
      puckGlow.addColorStop(0, "rgba(255, 255, 255, 1.0)");
      puckGlow.addColorStop(0.3, "rgba(249, 115, 22, 0.9)");
      puckGlow.addColorStop(1, "rgba(249, 115, 22, 0)");
      gCtx.fillStyle = puckGlow;
      gCtx.beginPath();
      gCtx.arc(px, py, glowR, 0, Math.PI * 2);
      gCtx.fill();

      gCtx.fillStyle = "#ffffff";
      gCtx.beginPath();
      gCtx.arc(px, py, coreR, 0, Math.PI * 2);
      gCtx.fill();

      // Total Combined Vector G & Peak Tracking
      const totalG = Math.sqrt(smoothLateralG * smoothLateralG + smoothLongitudinalG * smoothLongitudinalG);
      if (totalG > peakG) {
        peakG = totalG;
        gPeakVal.textContent = `${peakG.toFixed(1)}G`;
      }
      gValText.textContent = `${totalG.toFixed(1)} G`;
    }

    // --- DEMO SIMULATION ENGINE ---
    function runDemoSimulation(now) {
      const loopT = (now % 112000) / 112000;
      const angle = loopT * Math.PI * 8;
      const radius = 0.5 + Math.sin(loopT * Math.PI * 6) * 0.45;
      rawLateralG = Math.cos(angle) * radius;
      rawLongitudinalG = Math.sin(angle) * (radius * 0.85);
    }

    // --- FIREBASE RTDB INGESTION ---
    const FIREBASE_REST_URL = "https://fiero-telemetry-default-rtdb.firebaseio.com/raceTelemetry.json";
    let lastFreshDataWallTime = 0;

    function ingestTelemetryRoot(root) {
      if (!root || typeof root !== 'object') return;
      const now = Date.now();

      let telem = root;
      if (root.latG === undefined && root.longG === undefined && root.ax === undefined) {
        const keys = Object.keys(root).filter(k => typeof root[k] === 'object' && root[k] !== null && k !== 'autox');
        if (keys.length > 0) telem = root[keys[keys.length - 1]];
      }

      // G-Force from Database (Sensor Logger 3-axis or 2-axis)
      if (telem.latG !== undefined && telem.longG !== undefined) {
        rawLateralG = Number(telem.latG);
        rawLongitudinalG = Number(telem.longG);
        lastFreshDataWallTime = now;
      } else if (telem.ax !== undefined || telem.ay !== undefined) {
        const ax = Number(telem.ax || 0);
        const ay = Number(telem.ay || 0);
        const az = Number(telem.az || 0);
        if (Math.abs(az) > 0.1 && Math.abs(ay) > 0.1) {
          rawLateralG = ay / 9.81;
          rawLongitudinalG = az / 9.81;
        } else {
          rawLateralG = ax / 9.81;
          rawLongitudinalG = ay / 9.81;
        }
        lastFreshDataWallTime = now;
      }
    }

    db.on("value", (snap) => ingestTelemetryRoot(snap.val()));

    let isFetchingFallback = false;
    async function fetchTelemetryFallback() {
      if (isFetchingFallback || isDemoMode) return;
      isFetchingFallback = true;
      try {
        const res = await fetch(FIREBASE_REST_URL, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          ingestTelemetryRoot(data);
        }
      } catch (e) {
      } finally {
        isFetchingFallback = false;
      }
    }

    setInterval(() => {
      const now = Date.now();
      if (!isDemoMode && (!lastFreshDataWallTime || (now - lastFreshDataWallTime) > 2000)) {
        fetchTelemetryFallback();
      }
    }, 1000);

    function handleAppWakeup() {
      if (typeof firebase !== "undefined" && firebase.database) {
        try { firebase.database().goOnline(); } catch (e) {}
      }
      fetchTelemetryFallback();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") handleAppWakeup();
    });
    window.addEventListener("focus", handleAppWakeup);
    window.addEventListener("pageshow", handleAppWakeup);

    firebase.database().ref(".info/connected").on("value", (snap) => {
      if (!snap.val() && !isDemoMode) {
        try { firebase.database().goOnline(); } catch (e) {}
        fetchTelemetryFallback();
      }
    });

    // URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("demo") === "1" || urlParams.get("demo") === "true") {
      isDemoMode = true;
    }
  </script>
</body>
</html>
