<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM Stream Leaderboard Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      padding: 8px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: auto;
    }

    .leaderboard-scaler-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      overflow: hidden;
    }

    /* Compact Racing Leaderboard Card */
    .leaderboard-card {
      display: inline-flex;
      flex-direction: column;
      background: rgba(8, 12, 22, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-left: 5px solid #f97316;
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
      width: 290px;
      gap: 6px;
      flex-shrink: 0;
      transform-origin: top center;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Bar */
    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trophy-icon {
      font-size: 13px;
    }

    .title-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #f97316;
    }

    .event-chip {
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    /* Driver Rows List */
    .driver-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .driver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      padding: 5px 8px;
      transition: all 0.25s ease;
    }

    .driver-row.p1 {
      background: rgba(34, 197, 94, 0.10);
      border-color: rgba(34, 197, 94, 0.35);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-pill {
      font-size: 10px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.06);
      min-width: 26px;
      text-align: center;
    }

    .driver-row.p1 .rank-pill {
      background: rgba(34, 197, 94, 0.25);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .driver-name {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.5px;
    }

    .row-right {
      display: flex;
      align-items: baseline;
      gap: 6px;
      text-align: right;
    }

    .best-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 900;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    .driver-row.p1 .best-time {
      color: #4ade80;
    }

    .best-time.no-time {
      color: #64748b;
      font-size: 11px;
    }

    .delta-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      min-width: 44px;
      text-align: right;
    }

    .delta-pill.leader {
      color: #4ade80;
      font-weight: 800;
    }

    /* Sub-footer Live Dot */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 4px;
      font-size: 8px;
      color: #64748b;
      font-family: ui-monospace, monospace;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>

  <div class="leaderboard-scaler-wrap">
    <div class="leaderboard-card">
    <!-- Header -->
    <div class="leaderboard-header">
      <div class="header-left">
        <span class="trophy-icon">🏆</span>
        <span class="title-text">Fastest Times</span>
      </div>
      <span class="event-chip" id="event-title-display">Sunday Autocross</span>
    </div>

    <!-- Ranked Driver List -->
    <div class="driver-list" id="driver-list">
      <!-- Generated rows -->
    </div>

    <!-- Footer Sync Indicator -->
    <div class="footer-bar">
      <span><span class="status-dot"></span>REAL-TIME SYNC</span>
      <span id="run-count-display">0 RUNS LOGGED</span>
    </div>
  </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCC4JUzjr5lk9zaT78wwZ1RcjUguP5Q70s",
      authDomain: "fiero-telemetry.firebaseapp.com",
      databaseURL: "https://fiero-telemetry-default-rtdb.firebaseio.com",
      projectId: "fiero-telemetry",
      storageBucket: "fiero-telemetry.firebasestorage.app",
      messagingSenderId: "183922450878",
      appId: "1:183922450878:web:5faabfd6d163f1c6c119ef"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("raceTelemetry");

    const DRIVERS = ["Jeff", "Liam", "Ryan", "Matt"];
    const driverListEl = document.getElementById("driver-list");
    const eventTitleEl = document.getElementById("event-title-display");
    const runCountEl = document.getElementById("run-count-display");

    // Check URL parameters for explicit event lock: ?event=Sunday+Autocross
    const urlParams = new URLSearchParams(window.location.search);
    let activeEventName = urlParams.get("event") || "Sunday Autocross";
    let currentEventRef = null;

    function getEventKey(name) {
      return (name || "Sunday Autocross")
        .trim()
        .toLowerCase()
        .replace(/[.$#[\]/]/g, "")
        .replace(/\s+/g, "_")
        .slice(0, 64) || "sunday_autocross";
    }

    function formatTimeMs(ms) {
      if (ms >= 99999999 || ms === Infinity) return "--:--.--";
      const min = Math.floor(ms / 60000);
      const sec = Math.floor((ms % 60000) / 1000);
      const hundredths = Math.floor((ms % 1000) / 10);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(hundredths).padStart(2, '0')}`;
    }

    function bindEventSync(eventName) {
      activeEventName = eventName;
      eventTitleEl.textContent = eventName;

      const eventKey = getEventKey(eventName);

      if (currentEventRef) {
        currentEventRef.off();
      }

      // Connect to Firebase event runs: raceTelemetry/events/${eventKey}/runs
      currentEventRef = db.child("events").child(eventKey).child("runs");

      currentEventRef.on("value", (snapshot) => {
        const data = snapshot.val();
        let runs = [];
        if (data) {
          runs = Object.values(data);
        }
        renderLeaderboard(runs);
      }, (err) => {
        console.warn("Leaderboard overlay Firebase error:", err);
      });
    }

    function renderLeaderboard(runs) {
      runCountEl.textContent = `${runs.length} RUN${runs.length === 1 ? '' : 'S'} LOGGED`;

      // Build stats for all known drivers
      const allDrivers = [...new Set([...DRIVERS, ...runs.map(r => r.driver).filter(Boolean)])];

      const driverStats = allDrivers.map(name => {
        // Exclude DNFs from valid fastest times
        const validRuns = runs.filter(r => r.driver === name && !r.isDnf);
        if (validRuns.length === 0) {
          return {
            driver: name,
            bestTimeMs: Infinity,
            bestFormatted: "--:--.--",
            totalRuns: runs.filter(r => r.driver === name).length
          };
        }

        validRuns.sort((a, b) => a.finalTimeMs - b.finalTimeMs);
        const best = validRuns[0];
        return {
          driver: name,
          bestTimeMs: best.finalTimeMs,
          bestFormatted: best.finalFormatted || formatTimeMs(best.finalTimeMs),
          totalRuns: runs.filter(r => r.driver === name).length
        };
      });

      // Rank from fastest (lowest ms) to slowest
      driverStats.sort((a, b) => a.bestTimeMs - b.bestTimeMs);

      const leaderTime = (driverStats.length > 0 && driverStats[0].bestTimeMs !== Infinity)
        ? driverStats[0].bestTimeMs
        : null;

      // Render rows
      driverListEl.innerHTML = "";
      driverStats.forEach((st, idx) => {
        const isLeader = idx === 0 && st.bestTimeMs !== Infinity;
        const hasTime = st.bestTimeMs !== Infinity;

        let deltaDisplay = "--";
        if (isLeader) {
          deltaDisplay = "LEADER";
        } else if (hasTime && leaderTime !== null) {
          const diffSec = ((st.bestTimeMs - leaderTime) / 1000).toFixed(2);
          deltaDisplay = `+${diffSec}s`;
        }

        const row = document.createElement("div");
        row.className = `driver-row ${isLeader ? 'p1' : ''}`;
        row.innerHTML = `
          <div class="row-left">
            <span class="rank-pill">#${idx + 1}</span>
            <span class="driver-name">${st.driver.toUpperCase()}</span>
          </div>
          <div class="row-right">
            <span class="best-time ${hasTime ? '' : 'no-time'}">${st.bestFormatted}</span>
            <span class="delta-pill ${isLeader ? 'leader' : ''}">${deltaDisplay}</span>
          </div>
        `;
        driverListEl.appendChild(row);
      });
    }

    // Auto-listen to active event name from pit wall broadcast if not explicitly locked via URL param
    if (!urlParams.has("event")) {
      db.child("autox/eventName").on("value", (snap) => {
        const name = snap.val();
        if (name && name !== activeEventName) {
          bindEventSync(name);
        }
      });
    }

    // Initialize
    bindEventSync(activeEventName);

    // Auto-scale card dynamically when embedded in narrow iframes (Google Sites, mobile, etc.)
    function autoScaleLeaderboard() {
      const card = document.querySelector(".leaderboard-card");
      if (!card) return;
      const targetWidth = 300;
      const availWidth = window.innerWidth - 16;
      if (availWidth < targetWidth && availWidth > 0) {
        const scale = Math.max(0.4, availWidth / targetWidth);
        card.style.transform = "scale(" + scale + ")";
      } else {
        card.style.transform = "none";
      }
    }
    window.addEventListener("resize", autoScaleLeaderboard);
    window.addEventListener("orientationchange", autoScaleLeaderboard);
    window.addEventListener("DOMContentLoaded", autoScaleLeaderboard);
    setTimeout(autoScaleLeaderboard, 60);
  </script>
</body>
</html>
